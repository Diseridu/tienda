<!DOCTYPE html>
<html lang="es">
<head>
    <script>
      (function() {
        // Capture host references before any artifact code runs: Window.parent
        // is [Replaceable] (a top-level `var parent` in artifact code would
        // replace the accessor with a data property), and a top-level
        // `const crypto` would shadow the global — either would otherwise
        // silently break the bridge for artifacts that worked before.
        const realParent = window.parent;
        const cryptoObj = window.crypto;
        // html-to-image is only used by takeScreenshot: fetched on first use, not as a
        // parser-blocking tag. Native fetch, captured before the proxy override below.
        const realFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
        const HTML_TO_IMAGE_SRC = "https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.13/html-to-image.min.js";
        const HTML_TO_IMAGE_INTEGRITY = "sha512-iZ2ORl595Wx6miw+GuadDet4WQbdSWS3JLMoNfY8cRGoEFy6oT3G9IbcrBeL6AfkgpA51ETt/faX6yLV+/gFJg==";
        let htmlToImageLoad = null;
        const loadHtmlToImage = () => {
          if (!htmlToImageLoad) {
            htmlToImageLoad = (realFetch
              ? realFetch(HTML_TO_IMAGE_SRC, { integrity: HTML_TO_IMAGE_INTEGRITY, credentials: 'omit', referrerPolicy: 'no-referrer' })
              : Promise.reject(new Error('fetch unavailable'))
            )
              .then((res) => {
                if (!res.ok) throw new Error('html-to-image failed to load (' + res.status + ')');
                return res.text();
              })
              .then((source) => {
                // UMD bundle: hide the artifact's AMD/CommonJS globals so it takes the
                // window-global branch; inline script text runs synchronously on insert.
                const hidden = ['define', 'module', 'exports'].map((k) => {
                  const entry = { k, own: Object.prototype.hasOwnProperty.call(window, k), v: window[k] };
                  try { window[k] = undefined; } catch (e) {}
                  return entry;
                });
                try {
                  const el = document.createElement('script');
                  el.text = source;
                  (document.head || document.documentElement).appendChild(el);
                } finally {
                  hidden.forEach(({ k, own, v }) => {
                    try { if (own) { window[k] = v; } else { delete window[k]; } } catch (e) {}
                  });
                }
                if (!window.htmlToImage) throw new Error('html-to-image unavailable after load');
                return window.htmlToImage;
              });
            // A failed load may be transient; let the next screenshot retry.
            htmlToImageLoad.catch(() => { htmlToImageLoad = null; });
          }
          return htmlToImageLoad;
        };
        // crypto.randomUUID exists only in Secure Contexts; fall back to a
        // unique non-crypto id elsewhere (http://LAN-IP dev flows) —
        // uniqueness is what the bridge needs, unpredictability is
        // defense-in-depth on top of the source guards.
        const newRequestId =
          cryptoObj && typeof cryptoObj.randomUUID === "function"
            ? function () { return cryptoObj.randomUUID(); }
            : function () { return Date.now() + "-" + Math.random(); };
        const originalConsole = window.console;
        window.console = {
          log: (...args) => {
            originalConsole.log(...args);
            realParent.postMessage({ type: 'console', message: args.join(' ') }, '*');
          },
          error: (...args) => {
            originalConsole.error(...args);
            realParent.postMessage({ type: 'console', message: 'Error: ' + args.join(' ') }, '*');
          },
          warn: (...args) => {
            originalConsole.warn(...args);
            realParent.postMessage({ type: 'console', message: 'Warning: ' + args.join(' ') }, '*');
          }
        };

        // Bridge request ids are crypto-random (not sequential) so they
        // cannot be predicted by other frames in the tab.
        let callbacksMap = new Map();
        let streamControllers = new Map();
        
        window.claude = {
          complete: (prompt) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'claudeComplete', id, prompt }, '*');
            });
          }
        };

        window.storage = {
          get: (key, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'storageGet', id, key, shared }, '*');
            });
          },
          set: (key, value, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'storageSet', id, key, value, shared }, '*');
            });
          },
          delete: (key, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'storageDelete', id, key, shared }, '*');
            });
          },
          list: (prefix, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = newRequestId();
              callbacksMap.set(id, { resolve, reject });
              realParent.postMessage({ type: 'storageList', id, prefix, shared }, '*');
            });
          }
        };

        let pendingBlobs = new Map();
        URL.createObjectURL = (blob) => {
          // Store the blob and create an ID and URL for it
          const blobId = `blob-${Date.now()}-${Math.random()}`;
          pendingBlobs.set(blobId, blob);
          return `blob-request://${blobId}`;
        };

        URL.revokeObjectURL = (url) => {
          // Remove the blob from our store
          const blobId = url.replace("blob-request://", "");
          pendingBlobs.delete(blobId);
        };

        const getBlobFromURL = (url) => {
          const blobId = url.replace("blob-request://", "");
          return pendingBlobs.get(blobId);
        };

        // Override global fetch with streaming support
        window.fetch = (url, init = {}) => {
          return new Promise((resolve, reject) => {
            const id = newRequestId();
            const channelId = `fetch-${id}-${Date.now()}`;
            
            callbacksMap.set(id, { 
              resolve: (response) => {
                // Null-body statuses: Response(stream, {status: 204}) throws
                // per the Fetch spec, which would escape this resolver and
                // hang the artifact's await forever.
                if (response.status === 204 || response.status === 205 || response.status === 304) {
                  try {
                    resolve(new Response(null, {
                      status: response.status,
                      statusText: response.statusText,
                      headers: response.headers
                    }));
                  } catch (err) {
                    // Invalid statusText/header bytes can throw here too.
                    reject(new TypeError(
                      'Bridge fetch: unconstructable response (status ' + response.status + ')'
                    ));
                  }
                  return;
                }
                // Create a ReadableStream for the response body
                const stream = new ReadableStream({
                  start(controller) {
                    streamControllers.set(channelId, controller);
                  },
                  cancel() {
                    streamControllers.delete(channelId);
                  }
                });
                
                // Create and return the Response with the stream. Response()
                // requires status in [200, 599]; an opaque/no-cors fetch
                // forwards status 0, which would throw here and escape the
                // resolver, hanging the artifact's await. Surface it as a
                // network-error-shaped rejection instead.
                try {
                  resolve(new Response(stream, {
                    status: response.status,
                    statusText: response.statusText,
                    headers: response.headers
                  }));
                } catch (err) {
                  streamControllers.delete(channelId);
                  reject(new TypeError(
                    'Bridge fetch: unconstructable response (status ' + response.status + ')'
                  ));
                }
              },
              reject,
              channelId
            });
            
            realParent.postMessage({
              type: 'proxyFetch',
              id,
              url,
              init,
              channelId
            }, '*');
          });
        };

        window.addEventListener('message', async (event) => {
          // Only the embedding parent may drive the bridge — sibling and
          // nested frames can also postMessage into this window.
          if (event.source !== realParent) return;
          if (event.data.type === 'takeScreenshot') {
            // Echo the request's nonce so the requester can correlate the
            // reply to ITS request — a reply without the expected nonce
            // (e.g. from a stale pre-remount artifact) is ignored upstream.
            const screenshotNonce = event.data.nonce;
            const rootElement = document.getElementById('artifacts-component-root-html');
            if (!rootElement) {
              realParent.postMessage({
                type: 'screenshotError',
                nonce: screenshotNonce,
                error: new Error('Root element not found'),
              }, '*');
              return;
            }
            // Catch CDN load failures and toPng errors so the parent always
            // gets a response instead of hanging forever.
            try {
              const htmlToImage = await loadHtmlToImage();
              const screenshot = await htmlToImage.toPng(rootElement, {
                imagePlaceholder:
                  "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAA1JREFUGFdjePDgwX8ACOQDoNsk0PMAAAAASUVORK5CYII=",
              });
              realParent.postMessage({
                type: 'screenshotData',
                nonce: screenshotNonce,
                data: screenshot,
              }, '*');
            } catch (err) {
              realParent.postMessage({
                type: 'screenshotError',
                nonce: screenshotNonce,
                error: err instanceof Error ? err : new Error(String(err)),
              }, '*');
            }
          } else if (event.data.type === 'claudeComplete') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.completion);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'proxyFetchResponse') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
              callbacksMap.delete(event.data.id);
            } else {
              // Initial response with headers, status, etc.
              callback.resolve({
                status: event.data.status,
                statusText: event.data.statusText,
                headers: event.data.headers
              });
              // Don't delete the callback yet if streaming
              if (!event.data.body) {
                callbacksMap.delete(event.data.id);
              }
            }
          } else if (event.data.type === 'proxyFetchStream') {
            // Handle streaming data chunks
            const controller = streamControllers.get(event.data.channelId);
            if (controller) {
              if (event.data.error) {
                controller.error(new Error(event.data.error));
                streamControllers.delete(event.data.channelId);
              } else if (event.data.done) {
                controller.close();
                streamControllers.delete(event.data.channelId);
                // Clean up the callback
                const callback = Array.from(callbacksMap.entries()).find(
                  ([_, value]) => value.channelId === event.data.channelId
                );
                if (callback) {
                  callbacksMap.delete(callback[0]);
                }
              } else if (event.data.chunk) {
                controller.enqueue(new Uint8Array(event.data.chunk));
              }
            }
          } else if (event.data.type === 'storageGet') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageSet') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageDelete') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageList') {
            const callback = callbacksMap.get(event.data.id);
            if (!callback) return;
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          }
        });

        window.addEventListener('click', (event) => {
          const isEl = event.target instanceof HTMLElement;
          if (!isEl) return;
    
          // find ancestor links
          const linkEl = event.target.closest("a");
          if (!linkEl || !linkEl.href) return;
    
          event.preventDefault();
          event.stopImmediatePropagation();
    
          if (linkEl.href.startsWith("blob-request:")) {
            const blob = getBlobFromURL(linkEl.href);
            if (!blob) return;
            void blob.arrayBuffer().then((data) => {
              realParent.postMessage({
                type: "downloadFile",
                filename: linkEl.download,
                data,
                mimeType: blob.type || "application/octet-stream",
              });
            });
          } else if (linkEl.href.startsWith("data:")) {
            const [header, base64Data] = linkEl.href.split(",");
            const mimeMatch = header.match(/data:([^;]+)/);
            const mimeType = mimeMatch ? mimeMatch[1] : "application/octet-stream";
            const binaryString = atob(base64Data);
            const data = Uint8Array.from(binaryString, (c) =>
              c.charCodeAt(0),
            ).buffer;
            realParent.postMessage({
              type: "downloadFile",
              filename: linkEl.download,
              data,
              mimeType,
            });
          } else {
            let linkUrl;
            try {
              linkUrl = new URL(linkEl.href);
            } catch (error) {
              return;
            }
    
            if (linkUrl.hostname === window.location.hostname) return;
      
            realParent.postMessage({
              type: 'openExternal',
              href: linkEl.href,
            }, '*');
          }
      });

        const originalOpen = window.open;
        window.open = function (url) {
          realParent.postMessage({
            type: "openExternal",
            href: url,
          }, "*");
        };

        window.addEventListener('error', (event) => {
          realParent.postMessage({ type: 'console', message: 'Uncaught Error: ' + event.message }, '*');
        });
      })();
    </script>
  <style id="claude-scrollbar">@layer claude-scrollbar{*{scrollbar-width:thin}html{scrollbar-color:rgb(128 128 128 / 50%) transparent}}</style>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DISERIDU">
<meta name="theme-color" content="#111111">
<meta name="format-detection" content="telephone=no">
<title>DISERIDU — Estampas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F2EEE1;
    --ink:#111111;
    --yellow:#F6C90E;
    --red:#D93A2B;
    --line:4px;
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
    --sar: env(safe-area-inset-right, 0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    height:100%;
    overflow:hidden;
    overscroll-behavior:none;
    background:var(--cream);
    color:var(--ink);
    font-family:'Space Mono', monospace;
    -webkit-font-smoothing:antialiased;
    touch-action:manipulation;
  }
  /* iOS Safari address-bar-safe viewport height, with fallback for older browsers */
  html{height:-webkit-fill-available;}
  body{height:100vh;height:100dvh;height:-webkit-fill-available;}
  #root{height:100%;}

  h1,h2,h3,.display{
    font-family:'Anton', sans-serif;
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin:0;
  }
  a{color:inherit;-webkit-touch-callout:none;}
  button{font-family:'Space Mono',monospace;touch-action:manipulation;}
  img{-webkit-user-drag:none;user-select:none;}

  .app{
    height:100%;
    display:flex;
    flex-direction:column;
    padding-top:var(--sat);
    padding-left:var(--sal);
    padding-right:var(--sar);
  }

  /* HEADER */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:8px 12px;
    border-bottom:var(--line) solid var(--ink);
    flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:8px;min-width:0;}
  .brand img{
    height:36px;width:36px;
    border-radius:50%;
    border:3px solid var(--ink);
    object-fit:cover;
    flex-shrink:0;
  }
  .brand-name{font-size:17px;}
  .brand-sub{font-size:9px;letter-spacing:1px;opacity:0.75;}
  header .wa-fixed{
    background:var(--ink);
    color:var(--cream);
    border:3px solid var(--ink);
    padding:9px 12px;
    min-height:40px;
    display:flex;
    align-items:center;
    font-weight:700;
    font-size:11px;
    text-decoration:none;
    white-space:nowrap;
  }
  header .wa-fixed:hover{background:var(--red);border-color:var(--red);}

  /* SECTION TABS */
  .tabs{
    display:flex;
    border-bottom:3px solid var(--ink);
    flex-shrink:0;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:11px 4px;
    min-height:44px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.3px;
    text-transform:uppercase;
    cursor:pointer;
    background:var(--cream);
    border-right:2px solid var(--ink);
    user-select:none;
  }
  .tab:last-child{border-right:none;}
  .tab.active{background:var(--ink);color:var(--cream);}
  .tab .count{opacity:0.6;font-weight:400;font-size:10px;}

  /* STAGE */
  .stage{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:8px 4px;
    position:relative;
  }
  .nav-arrow{
    flex-shrink:0;
    width:40px;
    height:52px;
    border:3px solid var(--ink);
    background:var(--cream);
    font-size:18px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:3px 3px 0 var(--ink);
  }
  .nav-arrow:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
  .nav-arrow:disabled{opacity:0.25;cursor:default;box-shadow:none;}

  .panel-wrap{
    flex:1;
    height:100%;
    max-width:900px;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .panel{
    background:#fff;
    border:3px solid var(--ink);
    box-shadow:6px 6px 0 var(--ink);
    width:100%;
    height:100%;
    max-height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .panel-media{
    flex:0 0 36%;
    min-height:0;
    border-bottom:3px solid var(--ink);
    background:#000;
    display:flex;
  }
  .panel-media img{
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .panel-body{
    flex:1 1 auto;
    min-height:0;
    padding:10px 14px;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .panel-title{font-size:clamp(18px,5vw,32px);line-height:1;}

  .field-label{font-size:9px;letter-spacing:1px;font-weight:700;opacity:0.7;}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;}
  .swatch{width:30px;height:30px;border:2px solid var(--ink);cursor:pointer;position:relative;flex-shrink:0;}
  .swatch[data-color="Negro"]{background:#111;}
  .swatch[data-color="Blanco"]{background:#fdfdfd;}
  .swatch.selected::after{content:"";position:absolute;inset:-5px;border:2px solid var(--red);}

  .sizes{display:flex;gap:5px;flex-wrap:wrap;}
  .size-btn{
    border:2px solid var(--ink);
    background:#fff;
    font-weight:700;
    font-size:11px;
    padding:7px 9px;
    min-height:32px;
    display:flex;
    align-items:center;
    cursor:pointer;
  }
  .size-btn.selected{background:var(--ink);color:var(--cream);}

  .buy-btn{
    margin-top:auto;
    background:var(--red);
    color:var(--cream);
    border:3px solid var(--ink);
    font-weight:700;
    font-size:13px;
    padding:12px 10px;
    min-height:46px;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:3px 3px 0 var(--ink);
  }
  .buy-btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  .buy-btn:hover{background:var(--ink);}

  .empty-panel{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-align:center;
    padding:20px;
  }
  .empty-panel .display{font-size:clamp(20px,3vw,30px);}
  .empty-panel p{font-size:12px;opacity:0.75;max-width:320px;}

  /* PAGER DOTS */
  .pager{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:6px;
    flex-shrink:0;
    font-size:11px;
    font-weight:700;
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#ccc;border:1px solid var(--ink);}
  .dot.active{background:var(--red);}

  footer{
    border-top:3px solid var(--ink);
    padding:6px 14px calc(6px + var(--sab));
    font-size:9px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-shrink:0;
    flex-wrap:wrap;
    text-align:center;
  }
  footer a{text-decoration:underline;}

  /* Mobile is the default layout above. From here up, widen for tablet/desktop. */
  @media (min-width:700px){
    header{padding:12px 22px;}
    .brand img{height:44px;width:44px;}
    .brand-name{font-size:20px;}
    .brand-sub{font-size:10px;}
    header .wa-fixed{font-size:12px;padding:10px 16px;}
    .tab{font-size:13px;padding:12px 8px;}
    .nav-arrow{width:48px;height:60px;font-size:22px;}
    .panel{flex-direction:row;box-shadow:8px 8px 0 var(--ink);}
    .panel-media{flex:1 1 42%;border-bottom:none;border-right:3px solid var(--ink);}
    .panel-body{flex:1 1 58%;padding:20px 24px;gap:10px;}
    .panel-title{font-size:clamp(24px,3vw,34px);}
    .swatch{width:24px;height:24px;}
    .size-btn{font-size:12px;padding:5px 9px;min-height:auto;}
    .buy-btn{font-size:14px;}
    footer{font-size:11px;padding:8px 22px;}
  }

  /* ===== MODO EDICIÓN ===== */
  .edit-pencil{
    display:none;
    align-items:center;
    justify-content:center;
    width:24px;height:24px;

  .tab{position:relative;}
  .tab .edit-pencil{margin-left:4px;width:18px;height:18px;font-size:9px;}
  .panel-title-row{display:flex;align-items:center;gap:6px;}
  .panel-media{position:relative;}

    position:absolute;
    top:8px;right:8px;
    width:34px;height:34px;
    font-size:16px;
    z-index:5;

  .edit-toggle{
    position:fixed;
    right:10px;
    bottom:calc(10px + var(--sab));
    z-index:200;
    width:44px;height:44px;
    border-radius:50%;
    border:3px solid var(--ink);
    background:var(--yellow);
    color:var(--ink);
    font-size:17px;
    cursor:pointer;
    box-shadow:3px 3px 0 var(--ink);

    display:none;
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:150;

    font-size:10px;
    cursor:pointer;

    padding:10px;
    border:2px solid var(--ink);
    background:#fff;
    color:var(--ink);

    justify-content:flex-end;
    gap:8px;

    font-size:12px;
    padding:9px 14px;
    border:2px solid var(--ink);
    cursor:pointer;
  }
  .modal-cancel{background:#fff;color:var(--ink);}

const state = {
  sectionIndex: 0,
  productIndex: {},
  selColor: {},
  selSize: {}
};
CONFIG.sections.forEach(s => { state.productIndex[s.id] = 0; });

let pendingImageTarget = null; // { type:'logo' } or { type:'product', productId, color }

function buildWaLink(number, message){ return "https://wa.me/" + number + "?text=" + encodeURIComponent(message); }

function currentSection(){ return CONFIG.sections[state.sectionIndex]; }
function currentProducts(){ return PRODUCTS[currentSection().id] || []; }
function currentProduct(){
  const list = currentProducts();
  if (!list.length) return null;
  return list[state.productIndex[currentSection().id]];
}

function applyStaticConfig(){
  document.getElementById("logoImg").src = CONFIG.logo;
  document.getElementById("brandName").textContent = CONFIG.brandName;
  document.getElementById("brandSub").textContent = CONFIG.brandSub;
  const waGeneric = document.getElementById("wa-generic");
  waGeneric.textContent = CONFIG.waButtonLabel;
  waGeneric.href = buildWaLink(CONFIG.whatsappNumber, "Hola! Quiero hacer una consulta sobre los diseños de " + CONFIG.brandName + ".");
  document.getElementById("footerStrip").textContent = CONFIG.footerStrip;
  const ig = document.getElementById("footerIg");
  ig.textContent = CONFIG.igHandle;
  ig.href = CONFIG.igUrl;
}

function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  CONFIG.sections.forEach((sec, i) => {
    const t = document.createElement("div");
    t.className = "tab" + (i === state.sectionIndex ? " active" : "");

    const labelSpan = document.createElement("span");
    labelSpan.innerHTML = sec.label + ' <span class="count">(' + (PRODUCTS[sec.id] || []).length + ')</span>';
    t.appendChild(labelSpan);

    if (EDITABLE){
      const pencil = document.createElement("button");
      pencil.className = "edit-pencil";
      pencil.type = "button";
      pencil.textContent = "✎";
      pencil.addEventListener("click", async (e) => {
        e.stopPropagation();
        const nuevo = await showPrompt("Nombre de la sección", sec.label);
        if (nuevo && nuevo.trim()){
          sec.label = nuevo.trim();
          renderAll();
        }
      });
      t.appendChild(pencil);
    }

    t.addEventListener("click", () => {
      state.sectionIndex = i;
      renderAll();
    });
    tabs.appendChild(t);
  });
}

function renderPager(){
  const pager = document.getElementById("pager");
  pager.innerHTML = "";
  const list = currentProducts();
  if (!list.length) return;
  const idx = state.productIndex[currentSection().id];
  const label = document.createElement("span");
  label.textContent = (idx + 1) + " / " + list.length + "  ";
  pager.appendChild(label);
  list.forEach((_, i) => {
    const d = document.createElement("div");
    d.className = "dot" + (i === idx ? " active" : "");
    pager.appendChild(d);
  });
}

function renderPanel(){
  const panel = document.getElementById("panel");
  panel.innerHTML = "";
  const product = currentProduct();

  if (!product){
    panel.innerHTML = '<div class="empty-panel"><div class="display">Próximamente</div><p>Todavía no cargamos diseños en "' + currentSection().label + '". Escribinos si querés proponer uno.</p></div>';
    document.getElementById("prevBtn").disabled = true;
    document.getElementById("nextBtn").disabled = true;
    return;
  }

  const colorNames = Object.keys(product.colors);
  if (!(product.id in state.selColor)) state.selColor[product.id] = colorNames[0];
  if (!(product.id in state.selSize)) state.selSize[product.id] = "M";

  const media = document.createElement("div");
  media.className = "panel-media";
  const img = document.createElement("img");
  img.src = product.colors[state.selColor[product.id]];
  img.alt = product.name;
  media.appendChild(img);

  if (EDITABLE){
    const imgPencil = document.createElement("button");
    imgPencil.className = "edit-pencil";
    imgPencil.type = "button";
    imgPencil.title = "Cambiar imagen (" + state.selColor[product.id] + ")";
    imgPencil.textContent = "✎";
    imgPencil.addEventListener("click", (e) => {
      e.stopPropagation();
      pendingImageTarget = { type: "product", productId: product.id, color: state.selColor[product.id] };
      document.getElementById("fileInput").click();
    });
    media.appendChild(imgPencil);
  }

  panel.appendChild(media);

  const body = document.createElement("div");
  body.className = "panel-body";

  const titleRow = document.createElement("div");
  titleRow.className = "panel-title-row";
  const title = document.createElement("div");
  title.className = "panel-title display";
  title.textContent = product.name;
  titleRow.appendChild(title);

  if (EDITABLE){
    const namePencil = document.createElement("button");
    namePencil.className = "edit-pencil";
    namePencil.type = "button";
    namePencil.textContent = "✎";
    namePencil.addEventListener("click", async () => {
      const nuevo = await showPrompt("Nombre del diseño", product.name);
      if (nuevo && nuevo.trim()){
        product.name = nuevo.trim();
        renderAll();
      }
    });
    titleRow.appendChild(namePencil);
  }
  body.appendChild(titleRow);

  if (colorNames.length > 1){
    const colorLabel = document.createElement("div");
    colorLabel.className = "field-label";
    colorLabel.textContent = "COLOR";
    body.appendChild(colorLabel);

    const swatches = document.createElement("div");
    swatches.className = "swatches";
    colorNames.forEach(colorName => {
      const sw = document.createElement("div");
      sw.className = "swatch" + (colorName === state.selColor[product.id] ? " selected" : "");
      sw.dataset.color = colorName;
      sw.title = colorName;
      sw.addEventListener("click", () => {
        state.selColor[product.id] = colorName;
        renderPanel();
      });
      swatches.appendChild(sw);
    });
    body.appendChild(swatches);
  }

  const sizeLabel = document.createElement("div");
  sizeLabel.className = "field-label";
  sizeLabel.textContent = "TALLE";
  body.appendChild(sizeLabel);

  const sizes = document.createElement("div");
  sizes.className = "sizes";
  SIZES.forEach(size => {
    const btn = document.createElement("div");
    btn.className = "size-btn" + (size === state.selSize[product.id] ? " selected" : "");
    btn.textContent = size;
    btn.addEventListener("click", () => {
      state.selSize[product.id] = size;
      sizes.querySelectorAll(".size-btn").forEach(s => s.classList.remove("selected"));
      btn.classList.add("selected");
      updateLink();
    });
    sizes.appendChild(btn);
  });
  body.appendChild(sizes);

  const buyBtn = document.createElement("a");
  buyBtn.className = "buy-btn";
  buyBtn.target = "_blank";
  buyBtn.rel = "noopener";
  buyBtn.textContent = "CONSULTAR POR WHATSAPP";
  body.appendChild(buyBtn);

  function updateLink(){
    const message = "Hola! Quiero el diseño \"" + product.name + "\", talle " + state.selSize[product.id] +
      (colorNames.length > 1 ? ", color " + state.selColor[product.id] : "") + ". ¿Me confirmás disponibilidad?";
    buyBtn.href = buildWaLink(CONFIG.whatsappNumber, message);
  }
  updateLink();

  panel.appendChild(body);

  const list = currentProducts();
  document.getElementById("prevBtn").disabled = list.length <= 1;
  document.getElementById("nextBtn").disabled = list.length <= 1;
}

function renderAll(){
  renderTabs();
  renderPanel();
  renderPager();
}

/* ===== MODO EDICIÓN ===== */

/* ===== MODAL PROPIO (reemplaza prompt/alert nativos) ===== */

function showPrompt(title, defaultValue){
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const box = document.createElement("div");
    box.className = "modal-box";

    const titleEl = document.createElement("div");
    titleEl.className = "modal-title";
    titleEl.textContent = title;
    box.appendChild(titleEl);

    const input = document.createElement("input");
    input.type = "text";
    input.className = "modal-input";
    input.value = defaultValue || "";
    box.appendChild(input);

    const actions = document.createElement("div");
    actions.className = "modal-actions";
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "modal-cancel";
    cancelBtn.textContent = "CANCELAR";
    const okBtn = document.createElement("button");
    okBtn.type = "button";
    okBtn.className = "modal-ok";
    okBtn.textContent = "OK";
    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    box.appendChild(actions);

    overlay.appendChild(box);
    document.body.appendChild(overlay);
    input.focus();
    input.select();

    function close(value){
      overlay.remove();
      resolve(value);
    }
    okBtn.addEventListener("click", () => close(input.value));
    cancelBtn.addEventListener("click", () => close(null));
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") close(input.value);
      if (e.key === "Escape") close(null);
    });
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(null); });
  });
}

function showAlert(message){
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const box = document.createElement("div");
    box.className = "modal-box";

    const titleEl = document.createElement("div");
    titleEl.className = "modal-title";
    titleEl.textContent = message;
    box.appendChild(titleEl);

    const actions = document.createElement("div");
    actions.className = "modal-actions";
    const okBtn = document.createElement("button");
    okBtn.type = "button";
    okBtn.className = "modal-ok";
    okBtn.textContent = "OK";
    actions.appendChild(okBtn);
    box.appendChild(actions);

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function close(){ overlay.remove(); resolve(); }
    okBtn.addEventListener("click", close);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(); });
  });
}

function showConfirm(message, okLabel){
  return new Promise((resolve) => {
    const overlay = document.createElement("div");
    overlay.className = "modal-overlay";
    const box = document.createElement("div");
    box.className = "modal-box";

    const titleEl = document.createElement("div");
    titleEl.className = "modal-title";
    titleEl.textContent = message;
    box.appendChild(titleEl);

    const actions = document.createElement("div");
    actions.className = "modal-actions";
    const cancelBtn = document.createElement("button");
    cancelBtn.type = "button";
    cancelBtn.className = "modal-cancel";
    cancelBtn.textContent = "CANCELAR";
    const okBtn = document.createElement("button");
    okBtn.type = "button";
    okBtn.className = "modal-ok";
    okBtn.textContent = okLabel || "ELIMINAR";
    actions.appendChild(cancelBtn);
    actions.appendChild(okBtn);
    box.appendChild(actions);

    overlay.appendChild(box);
    document.body.appendChild(overlay);

    function close(value){ overlay.remove(); resolve(value); }
    okBtn.addEventListener("click", () => close(true));
    cancelBtn.addEventListener("click", () => close(false));
    overlay.addEventListener("click", (e) => { if (e.target === overlay) close(false); });
  });
}

function resizeImageFile(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW){ h = Math.round(h * maxW / w); w = maxW; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function buildExportHtml(){
  const headHtml = document.head.outerHTML;
  const scriptEl = document.getElementById("mainScript");
  let scriptText = scriptEl.textContent;
  const dataBlock = "let CONFIG = " + JSON.stringify(CONFIG, null, 2) + ";\n" + "let PRODUCTS = " + JSON.stringify(PRODUCTS, null, 2) + ";";
  scriptText = scriptText.replace(/\/\*===DATA_START===\*\/[\s\S]*?\/\*===DATA_END===\*\//, "/*===DATA_START===*/\n" + dataBlock + "\n/*===DATA_END===*/");
  scriptText = scriptText.replace(/let EDITABLE = true;/, "let EDITABLE = false;");
  return "<!DOCTYPE html>\n<html lang=\"es\">\n" + headHtml + "\n<body>\n<noscript>Esta página necesita JavaScript para funcionar.</noscript>\n<div id=\"root\"></div>\n\n<script id=\"mainScript\">\n" + scriptText + "\n<\/script>\n</body>\n</html>";
}

async function downloadEditedHtml(){
  const html = buildExportHtml();
  const filename = "diseridu-tienda.html";
  const blob = new Blob([html], { type: "text/html" });

  // Dentro del visor de artifacts de Claude: usar la capacidad "downloads" del visor.
  if (window.claude && typeof window.claude.use === "function"){
    try{
      const downloads = await window.claude.use("downloads");
      if (downloads){
        try{
          await downloads.save({ filename, data: blob });
          return;
        } catch(err){
          if (err && err.code === "declined") return;
          // si falla por otro motivo, seguimos con el método estándar de abajo
        }
      }
    } catch(e){ /* seguimos con el método estándar de abajo */ }
  }

  // Archivo abierto normal en el navegador (ej. ya subido a GitHub Pages): descarga estándar.
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function initEditUI(){
  document.getElementById("editToggleBtn").addEventListener("click", () => {
    document.body.classList.toggle("edit-mode");
  });

  document.getElementById("editLogoBtn").addEventListener("click", () => {
    pendingImageTarget = { type: "logo" };
    document.getElementById("fileInput").click();
  });
  document.getElementById("barLogo").addEventListener("click", () => {
    pendingImageTarget = { type: "logo" };
    document.getElementById("fileInput").click();
  });

  document.getElementById("fileInput").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file || !pendingImageTarget) return;
    try{
      const dataUri = await resizeImageFile(file, pendingImageTarget.type === "logo" ? 300 : 900, 0.85);
      if (pendingImageTarget.type === "logo"){
        CONFIG.logo = dataUri;
        applyStaticConfig();
      } else if (pendingImageTarget.type === "product"){
        const list = currentProducts();
        const prod = list.find(p => p.id === pendingImageTarget.productId) ||
          Object.values(PRODUCTS).flat().find(p => p.id === pendingImageTarget.productId);
        if (prod){
          prod.colors[pendingImageTarget.color] = dataUri;
          renderPanel();
        }
      } else if (pendingImageTarget.type === "newProduct"){
        const secId = currentSection().id;
        if (!PRODUCTS[secId]) PRODUCTS[secId] = [];
        const newProduct = {
          id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          name: pendingImageTarget.name,
          colors: { "Negro": dataUri }
        };
        PRODUCTS[secId].push(newProduct);
        state.productIndex[secId] = PRODUCTS[secId].length - 1;
        renderAll();
      }
    } catch(err){
      await showAlert("No se pudo cargar la imagen.");
    }
    pendingImageTarget = null;
  });

  document.getElementById("barBrand").addEventListener("click", async () => {
    const nombre = await showPrompt("Nombre de la marca", CONFIG.brandName);
    if (nombre === null) return;
    const sub = await showPrompt("Subtítulo (debajo del nombre)", CONFIG.brandSub);
    if (nombre.trim()) CONFIG.brandName = nombre.trim();
    if (sub !== null && sub.trim()) CONFIG.brandSub = sub.trim();
    applyStaticConfig();
  });

  document.getElementById("barWa").addEventListener("click", async () => {
    const numero = await showPrompt("Número de WhatsApp (código de país + área + número, solo dígitos, ej: 5491125843143)", CONFIG.whatsappNumber);
    if (numero && numero.trim()){
      CONFIG.whatsappNumber = numero.trim().replace(/[^0-9]/g, "");
      applyStaticConfig();
      renderPanel();
    }
  });

  document.getElementById("barFooter").addEventListener("click", async () => {
    const texto = await showPrompt("Texto del pie de página", CONFIG.footerStrip);
    if (texto && texto.trim()){
      CONFIG.footerStrip = texto.trim();
      applyStaticConfig();
    }
  });

  document.getElementById("barIg").addEventListener("click", async () => {
    let handle = await showPrompt("Usuario de Instagram (sin @)", CONFIG.igHandle.replace(/^@/, ""));
    if (handle && handle.trim()){
      handle = handle.trim().replace(/^@/, "");
      CONFIG.igHandle = "@" + handle;
      CONFIG.igUrl = "https://instagram.com/" + handle;
      applyStaticConfig();
    }
  });

  document.getElementById("barAddProduct").addEventListener("click", async () => {
    const nombre = await showPrompt("Nombre de la nueva remera (se agrega en \"" + currentSection().label + "\")", "");
    if (!nombre || !nombre.trim()) return;
    pendingImageTarget = { type: "newProduct", name: nombre.trim() };
    document.getElementById("fileInput").click();
  });

  document.getElementById("barDeleteProduct").addEventListener("click", async () => {
    const product = currentProduct();
    if (!product){
      await showAlert("No hay ninguna remera para eliminar en esta sección.");
      return;
    }
    const ok = await showConfirm("¿Eliminar \"" + product.name + "\" de \"" + currentSection().label + "\"? Esta acción no se puede deshacer.");
    if (!ok) return;
    const secId = currentSection().id;
    const list = PRODUCTS[secId];
    const idx = list.findIndex(p => p.id === product.id);
    if (idx !== -1) list.splice(idx, 1);
    if (state.productIndex[secId] >= list.length) state.productIndex[secId] = Math.max(0, list.length - 1);
    renderAll();
  });

  document.getElementById("barDownload").addEventListener("click", downloadEditedHtml);
}

function init(){
  document.getElementById("root").innerHTML = BODY_SHELL;

  document.getElementById("prevBtn").addEventListener("click", () => {
    const secId = currentSection().id;
    const list = PRODUCTS[secId] || [];
    if (!list.length) return;
    state.productIndex[secId] = (state.productIndex[secId] - 1 + list.length) % list.length;
    renderAll();
  });
  document.getElementById("nextBtn").addEventListener("click", () => {
    const secId = currentSection().id;
    const list = PRODUCTS[secId] || [];
    if (!list.length) return;
    state.productIndex[secId] = (state.productIndex[secId] + 1) % list.length;
    renderAll();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft") document.getElementById("prevBtn").click();
    if (e.key === "ArrowRight") document.getElementById("nextBtn").click();
  });

  if (EDITABLE){
    initEditUI();
  } else {
    ["editToggleBtn","editBar","fileInput","editLogoBtn"].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.remove();
    });
    document.body.classList.remove("edit-mode");
  }
  applyStaticConfig();
  renderAll();
}

init();
