<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF8EC">
<meta name="description" content="Diseridú: remeras, tote bags y encendedores con memes, pop, rock y cultura argentina.">
<link rel="icon" href="perfil.jpg">
<title>Diseridú Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Archivo:wght@400;500;600&display=swap">
<style>
/* Layout: mobile-first tienda, franjas diagonales de marca como portada, papel crema con grano debajo; una sola vista visible por vez (ruteo por #hash). */
:root {
  --papel: #FBF8EC;
  --papel-2: #F1ECDA;
  --tinta: #221C26;
  --tinta-suave: #5E5563;
  --violeta: #8A6B9E;
  --petroleo: #1D879A;
  --rosa: #DF628A;
  --verde: #A8CB72;
  --coral: #F15A3D;
  --linea: #E2DBC6;
  --wpp: #1F9E57;
  --display: "Anton", "Oswald", "Arial Narrow", Impact, sans-serif;
  --label: "Oswald", "Arial Narrow", "Helvetica Neue", sans-serif;
  --texto: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --gutter: 16px;
  --max: 1080px;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--papel);
  color: var(--tinta);
  font: 400 16px/1.55 var(--texto);
  overflow-x: hidden;
}
body::after {
  content: "";
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 100;
  opacity: .16;
  mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .25  0 0 0 0 .2  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
img { max-width: 100%; display: block; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--petroleo); outline-offset: 2px; }
.wrap { max-width: var(--max); margin: 0 auto; padding-inline: var(--gutter); }

/* ---------- Header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--papel);
  border-bottom: 2px solid var(--tinta);
}
.tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.logo {
  font: 400 34px/1 var(--display);
  letter-spacing: .01em;
  text-decoration: none;
  padding-top: 4px;
}
.top .tabs { padding-block: 0 10px; }
.tab {
  flex: 1 0 auto; white-space: nowrap;
  border: 2px solid var(--tinta);
  background: transparent;
  border-radius: 999px;
  padding: 8px 7px 7px;
  font: 600 13px/1 var(--label); letter-spacing: .03em; text-transform: uppercase;
  text-decoration: none; text-align: center;
}
.tab[aria-current="page"][data-cat="remeras"] { background: var(--verde); }
.tab[aria-current="page"][data-cat="totes"] { background: var(--petroleo); color: #fff; }
.tab[aria-current="page"][data-cat="encendedores"] { background: var(--coral); color: #fff; }
.top .tabs.mas { -webkit-mask-image: linear-gradient(90deg, #000 82%, transparent); mask-image: linear-gradient(90deg, #000 82%, transparent); }
.tab-diseno { flex: none; background: var(--coral); color: #fff; box-shadow: 2px 2px 0 var(--tinta); }
.tab-diseno[aria-current="page"] { box-shadow: none; transform: translate(2px, 2px); }

/* ---------- Franjas de marca ---------- */
.franjas {
  background: linear-gradient(155deg,
    var(--rosa) 0 9%, var(--violeta) 9% 25%, var(--petroleo) 25% 43%,
    var(--rosa) 43% 58%, var(--verde) 58% 74%, var(--coral) 74% 90%, var(--violeta) 90%);
}

/* ---------- Home ---------- */
.hero { position: relative; overflow: hidden; }
.hero .wrap { padding-block: 34px 30px; display: grid; gap: 14px; }
.hero h1 {
  margin: 0;
  font: 400 clamp(72px, 24vw, 230px)/.86 var(--display);
  color: #fff;
  letter-spacing: -.005em;
  text-shadow: 0 2px 0 rgba(34, 28, 38, .12);
}
.hero p {
  margin: 0; max-width: 30ch;
  font: 600 18px/1.25 var(--label); letter-spacing: .06em; text-transform: uppercase;
  color: #fff;
}
.hero .handle {
  justify-self: start;
  background: var(--papel); color: var(--tinta);
  padding: 6px 12px 5px; border-radius: 999px;
  font: 600 13px/1 var(--label); letter-spacing: .1em; text-transform: uppercase; text-decoration: none;
}
.section { padding-block: 28px 8px; }
.eyebrow {
  font: 600 13px/1 var(--label); letter-spacing: .16em; text-transform: uppercase;
  color: var(--tinta-suave); margin: 0 0 12px;
}
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cat {
  position: relative; display: block; text-decoration: none;
  border: 2px solid var(--tinta); background: var(--papel-2);
  overflow: hidden;
}
.cat img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; transition: transform .4s ease; }
.cat.ancha { grid-column: 1 / -1; }
.cat.ancha img { aspect-ratio: 2 / 1; object-position: 50% 62%; }
.cat:hover img { transform: scale(1.03); }
.cat span {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--tinta); color: var(--papel);
  font: 600 14px/1 var(--label); letter-spacing: .12em; text-transform: uppercase;
  padding: 10px 12px; display: flex; justify-content: space-between;
}
.cta-wpp {
  display: grid; grid-template-columns: 112px 1fr; gap: 14px; align-items: center;
  margin-top: 22px; text-decoration: none;
  background: var(--rosa); color: #fff;
  border: 2px solid var(--tinta);
  padding: 10px;
}
.cta-wpp img { width: 112px; aspect-ratio: 3 / 4; object-fit: cover; border: 2px solid var(--papel); }
.cta-wpp strong { display: block; font: 400 30px/1 var(--display); margin-bottom: 6px; }
.cta-wpp small { font: 500 15px/1.35 var(--texto); }

/* ---------- Listado ---------- */
.cat-head { position: relative; overflow: hidden; border-bottom: 2px solid var(--tinta); }
.cat-head .wrap { position: relative; padding-block: 22px 18px; min-height: 180px; display: flex; flex-direction: column; justify-content: flex-end; }
.cat-head h1 {
  margin: 0; position: relative; z-index: 1;
  font: 400 clamp(62px, 17vw, 150px)/.85 var(--display);
}
.cat-head p { margin: 8px 0 0; position: relative; z-index: 1; max-width: 34ch; font-weight: 500; }
.cat-head.remeras { background: var(--papel); }
.cat-head.remeras h1 { color: var(--verde); }
.cat-head.remeras .foto {
  position: absolute; right: -6%; top: 0; bottom: 0; width: 52%;
  background: url("banner-remeras.jpg") 50% 30% / cover;
  border-left: 2px solid var(--tinta);
}
.cat-head.remeras .wrap { padding-right: 46%; }
.cat-head.totes { background: var(--petroleo); }
.cat-head.totes h1 { color: var(--papel); text-shadow: 2px 2px 0 var(--tinta); }
.cat-head.totes p { color: var(--papel); }
.cat-head.totes .wrap { padding-right: 56px; }
.cat-head.totes .vertical { color: var(--verde); }
.cat-head.encendedores { background: var(--papel); }
.cat-head.encendedores h1 { color: var(--petroleo); font-size: clamp(40px, 12vw, 130px); }
.cat-head.encendedores .wrap { padding-right: 76px; }
.cat-head.encendedores .vertical { color: #fff; background: var(--coral); padding: 10px 6px; }
.vertical {
  position: absolute; right: var(--gutter); bottom: 18px; z-index: 2;
  writing-mode: vertical-rl; transform: rotate(180deg);
  font: 700 15px/1 var(--label); letter-spacing: .2em; text-transform: uppercase; color: #fff;
}
.cat-head.remeras .vertical { color: var(--papel); background: var(--violeta); padding: 10px 6px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 16px 12px; }
.toolbar .count { font: 600 13px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--tinta-suave); }
.filtro { display: flex; gap: 6px; }
.filtro button {
  border: 2px solid var(--tinta); background: transparent; border-radius: 999px;
  padding: 6px 10px 5px; font: 600 12px/1 var(--label); letter-spacing: .1em; text-transform: uppercase;
}
.filtro button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; padding-bottom: 40px; }
@media (min-width: 720px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 980px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { display: grid; gap: 8px; min-width: 0; align-content: start; }
.card .ph { position: relative; background: var(--papel-2); border: 2px solid var(--tinta); overflow: hidden; }
.card .ph img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; transition: transform .35s ease; }
.card:hover .ph img { transform: scale(1.04); }
.card .tag {
  position: absolute; top: 8px; left: 8px;
  background: var(--papel); border: 1.5px solid var(--tinta);
  font: 600 11px/1 var(--label); letter-spacing: .1em; text-transform: uppercase;
  padding: 4px 6px 3px;
}
.card h3 { margin: 0; font: 600 16px/1.15 var(--label); letter-spacing: .03em; text-transform: uppercase; overflow-wrap: anywhere; }
.card .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.precio { font: 500 14px/1 var(--texto); color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 4px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--tinta); }
.dot.blanca { background: #fff; }
.dot.negra { background: #141114; }
.mini-wpp {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  border: 2px solid var(--tinta); border-radius: 999px; background: var(--wpp); color: #fff;
  padding: 8px 6px 7px; text-decoration: none;
  font: 600 12px/1 var(--label); letter-spacing: .08em; text-transform: uppercase;
}
.mini-wpp svg, .btn svg { width: 16px; height: 16px; flex: none; }
.card-link { display: grid; gap: 8px; text-decoration: none; }

/* ---------- Ficha de producto ---------- */
.back {
  display: inline-flex; align-items: center; gap: 6px; margin-block: 14px 10px;
  font: 600 13px/1 var(--label); letter-spacing: .12em; text-transform: uppercase; text-decoration: none;
}
.ficha { display: grid; gap: 18px; padding-bottom: 120px; }
@media (min-width: 860px) {
  .ficha { grid-template-columns: 1.1fr 1fr; gap: 36px; align-items: start; }
  .ficha .visor { position: sticky; top: 130px; }
}
.visor { display: grid; gap: 10px; min-width: 0; }
.visor .main {
  position: relative; border: 2px solid var(--tinta); background: var(--papel-2);
  padding: 0; display: block; width: 100%; overflow: hidden;
}
.visor .main img { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; transition: opacity .2s ease; }
.visor .main.swap img { opacity: .2; }
.zoom-hint {
  position: absolute; right: 10px; bottom: 10px;
  background: var(--tinta); color: var(--papel); border-radius: 999px;
  font: 600 11px/1 var(--label); letter-spacing: .12em; text-transform: uppercase;
  padding: 7px 10px 6px; display: inline-flex; gap: 6px; align-items: center;
}
.zoom-hint svg { width: 13px; height: 13px; }
.thumbs { display: flex; gap: 8px; }
.thumbs button { width: 64px; padding: 0; border: 2px solid var(--linea); background: var(--papel-2); }
.thumbs button[aria-pressed="true"] { border-color: var(--tinta); }
.thumbs img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; }
.info { display: grid; gap: 18px; min-width: 0; }
.info h1 { margin: 0; font: 400 clamp(42px, 11vw, 64px)/.95 var(--display); text-wrap: balance; text-transform: uppercase; }
.info .precio-big { font: 600 22px/1 var(--label); letter-spacing: .04em; }
.opt { display: grid; gap: 10px; }
.opt-label { display: flex; justify-content: space-between; font: 600 13px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; }
.opt-label em { font-style: normal; color: var(--tinta-suave); }
.colores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.color {
  display: flex; align-items: center; gap: 10px;
  border: 2px solid var(--linea); background: var(--papel); border-radius: 12px;
  padding: 10px 12px; text-align: left;
  font: 600 15px/1 var(--label); letter-spacing: .08em; text-transform: uppercase;
}
.color .sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--tinta); flex: none; }
.color[data-c="blanca"] .sw { background: #fff; }
.color[data-c="negra"] .sw { background: #141114; }
.color[aria-pressed="true"] { border-color: var(--tinta); background: var(--papel-2); box-shadow: 3px 3px 0 var(--tinta); }
.talles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.talle {
  border: 2px solid var(--linea); background: var(--papel); border-radius: 10px;
  padding: 11px 0 10px; font: 600 15px/1 var(--label); letter-spacing: .06em;
}
.talle[aria-pressed="true"] { border-color: var(--tinta); background: var(--tinta); color: var(--papel); }
.qty { display: inline-flex; align-items: center; border: 2px solid var(--tinta); border-radius: 999px; justify-self: start; }
.qty button { width: 42px; height: 40px; border: 0; background: transparent; font: 600 20px/1 var(--label); }
.qty output { min-width: 32px; text-align: center; font: 600 16px/1 var(--label); font-variant-numeric: tabular-nums; }
.desc { border-top: 2px solid var(--tinta); padding-top: 18px; display: grid; gap: 14px; }
.desc h2 { margin: 0; font: 600 14px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; }
.desc p { margin: 0; max-width: 62ch; }
.specs { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 8px 16px; font-size: 15px; }
.specs dt { font: 600 13px/1.6 var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-suave); }
.specs dd { margin: 0; min-width: 0; }
.relacionados { padding-top: 6px; }

/* Barra de compra fija (móvil) */
.buybar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--papel); border-top: 2px solid var(--tinta);
  padding: 10px var(--gutter) calc(10px + env(safe-area-inset-bottom, 0px));
}
.buybar .wrap { padding: 0; display: grid; gap: 8px; }
@media (min-width: 600px) { .buybar .wrap { grid-template-columns: 1fr auto; align-items: center; } }
.buybar .resumen { min-width: 0; font: 600 13px/1.25 var(--label); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.buybar .resumen small { color: var(--tinta-suave); font-weight: 500; letter-spacing: .04em; }
.buybar .resumen small::before { content: ' · '; }
.btn {
  border: 2px solid var(--tinta); background: var(--coral); color: #fff;
  border-radius: 999px; padding: 13px 18px 12px;
  font: 600 15px/1 var(--label); letter-spacing: .1em; text-transform: uppercase;
  box-shadow: 3px 3px 0 var(--tinta);
  text-decoration: none; text-align: center;
}
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--tinta); }
.btn.alt { background: var(--papel); color: var(--tinta); }
.btn.wpp { background: var(--wpp); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }

/* ---------- Lightbox ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(20, 16, 22, .94);
  display: grid; grid-template-rows: auto 1fr auto;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 0 calc(14px + env(safe-area-inset-bottom, 0px));
}
.lightbox .lb-top { display: flex; justify-content: space-between; align-items: center; padding-inline: var(--gutter); color: #fff; }
.lightbox .lb-top span { font: 600 13px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; }
.lightbox .cerrar {
  width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; background: transparent; color: #fff;
  font: 400 26px/1 var(--texto);
}
.lightbox .lb-img { overflow: auto; display: grid; place-items: center; touch-action: pinch-zoom pan-x pan-y; }
.lightbox .lb-img img { max-height: 100%; width: auto; max-width: 100%; object-fit: contain; cursor: zoom-in; }
.lightbox.zoomed .lb-img { place-items: start; }
.lightbox.zoomed .lb-img img { max-width: none; max-height: none; width: 200%; cursor: zoom-out; }
.lightbox .lb-colores { display: flex; gap: 10px; justify-content: center; padding-top: 10px; }
.lightbox .lb-colores .color { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.lightbox .lb-colores .color[aria-pressed="true"] { border-color: #fff; box-shadow: none; background: rgba(255,255,255,.1); }
.lightbox .lb-colores .color .sw { border-color: #fff; }


.pie { border-top: 2px solid var(--tinta); margin-top: 20px; }
.pie .wrap { padding-block: 22px 40px; display: grid; gap: 6px; }
.pie strong { font: 400 40px/1 var(--display); }
.pie p { margin: 0; font-size: 14px; color: var(--tinta-suave); }
.pie a { font-weight: 600; }

/* ---------- Generador de estampas ---------- */
.cat-head.diseno { background: var(--coral); }
.cat-head.diseno .wrap { padding-right: 56px; }
.cat-head.diseno h1 { color: var(--papel); }
.cat-head.diseno p { color: var(--papel); }
.cat-head.diseno .vertical { color: var(--tinta); }
.generador { display: grid; gap: 22px; padding-block: 18px 150px; }
@media (min-width: 860px) {
  .generador { grid-template-columns: 1.1fr 1fr; gap: 36px; align-items: start; }
  .generador .estudio-col { position: sticky; top: 130px; }
}
.estudio-col { display: grid; gap: 10px; min-width: 0; }
.estudio {
  position: relative; width: 100%; aspect-ratio: 1 / 1; max-width: 100%;
  background: #000; border: 2px solid var(--tinta); overflow: hidden;
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.estudio .base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.zona {
  position: absolute; left: 31%; top: 25%; width: 38%; height: 43%;
  border: 1.5px dashed var(--coral); background: rgba(241, 90, 61, .06);
  pointer-events: none;
}
.zona span {
  position: absolute; top: -18px; left: 0;
  font: 600 10px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--coral);
}
.capa { position: absolute; left: 50%; top: 46%; cursor: grab; touch-action: none; }
.capa:active { cursor: grabbing; }
.capa::before { content: ""; position: absolute; inset: -20px; }
.capa img { width: 100%; height: auto; pointer-events: none; -webkit-user-drag: none; }
.capa.activa img { outline: 1.5px dashed var(--coral); outline-offset: 3px; }
.estudio-vacio {
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  text-align: center; padding: 20px;
}
.estudio-vacio span {
  background: var(--papel); color: var(--tinta); border: 2px solid var(--tinta);
  padding: 9px 14px 8px; font: 600 13px/1.2 var(--label); letter-spacing: .1em; text-transform: uppercase;
}
.lectura { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.lectura .medida { font: 600 14px/1 var(--label); letter-spacing: .06em; font-variant-numeric: tabular-nums; }
.calidad {
  border: 1.5px solid var(--tinta); border-radius: 999px; padding: 5px 9px 4px;
  font: 600 11px/1 var(--label); letter-spacing: .1em; text-transform: uppercase;
}
.calidad.buena { background: var(--verde); }
.calidad.media { background: #F2C14E; }
.calidad.baja { background: var(--coral); color: #fff; }
.ayuda { margin: 0; font-size: 14px; color: var(--tinta-suave); }
.controles { display: grid; gap: 22px; min-width: 0; }
.paso { display: grid; gap: 10px; }
.paso-titulo { margin: 0; font: 600 13px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
.paso-titulo b {
  width: 22px; height: 22px; border-radius: 50%; background: var(--tinta); color: var(--papel);
  display: inline-grid; place-items: center; font-size: 12px; letter-spacing: 0;
}
.subir {
  display: grid; gap: 4px; justify-items: center; text-align: center;
  border: 2px dashed var(--tinta); background: var(--papel-2); padding: 20px 14px; cursor: pointer;
}
.subir.arrastrando { background: var(--verde); }
.subir strong { font: 600 16px/1.1 var(--label); letter-spacing: .06em; text-transform: uppercase; }
.subir small { color: var(--tinta-suave); font-size: 13px; }
.subir input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.slider { display: grid; gap: 6px; }
.slider label { display: flex; justify-content: space-between; font: 600 13px/1 var(--label); letter-spacing: .1em; text-transform: uppercase; }
.slider label output { color: var(--tinta-suave); font-variant-numeric: tabular-nums; }
.slider input { width: 100%; accent-color: var(--coral); height: 28px; margin: 0; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.seg button {
  border: 2px solid var(--linea); background: var(--papel); border-radius: 10px;
  padding: 11px 0 10px; font: 600 13px/1 var(--label); letter-spacing: .08em; text-transform: uppercase;
}
.seg button[aria-pressed="true"] { border-color: var(--tinta); background: var(--tinta); color: var(--papel); }
.acciones-sec { display: flex; flex-wrap: wrap; gap: 8px; }
.acciones-sec button {
  border: 2px solid var(--tinta); background: transparent; border-radius: 999px;
  padding: 8px 12px 7px; font: 600 12px/1 var(--label); letter-spacing: .1em; text-transform: uppercase;
}
.acciones-sec button[aria-pressed="true"] { background: var(--tinta); color: var(--papel); }
.buybar .acciones { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }
.buybar .acciones .btn { padding-inline: 10px; }
.cta-diseno {
  display: grid; grid-template-columns: 1fr 112px; gap: 14px; align-items: center;
  margin-top: 12px; text-decoration: none;
  background: var(--coral); color: #fff; border: 2px solid var(--tinta); padding: 10px 10px 10px 14px;
}
.cta-diseno img { width: 112px; aspect-ratio: 1 / 1; object-fit: cover; border: 2px solid var(--papel); }
.cta-diseno strong { display: block; font: 400 30px/1 var(--display); margin-bottom: 6px; }
.cta-diseno small { font: 500 15px/1.35 var(--texto); }
.lb-nota { margin: 0; padding: 10px var(--gutter) 0; text-align: center; color: #fff; font-size: 14px; }
/* ---------- Editor ---------- */
.modo { background: var(--tinta); color: var(--papel); }
.modo .wrap { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 8px; }
.modo span { font: 600 12px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; }
.modo nav { display: flex; gap: 6px; }
.modo a { color: var(--papel); text-decoration: none; border: 1.5px solid var(--papel); border-radius: 999px; padding: 6px 10px 5px; font: 600 12px/1 var(--label); letter-spacing: .1em; text-transform: uppercase; }
.modo a[aria-current="page"] { background: var(--papel); color: var(--tinta); }
.ed-cargar { display: grid; gap: 8px; padding: 14px; border: 2px dashed var(--tinta); background: var(--papel); }
.ed-cargar p { margin: 0; font-size: 15px; }
.ed-cargar .ed-cambiar { justify-self: start; padding-inline: 14px; }
.ed-msg { margin: 0; font-weight: 600; font-size: 14px; }
.ed-msg.error { color: var(--coral); }
.cat-head.editor { background: var(--tinta); }
.cat-head.editor h1 { color: var(--papel); }
.cat-head.editor p { color: var(--papel); opacity: .85; }
.cat-head.editor .wrap { padding-right: var(--gutter); }
.ed { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; padding-block: 20px 150px; }
.ed > * { min-width: 0; }
.ed-pasos { margin: 0; padding: 14px 16px 14px 34px; background: var(--papel-2); border: 2px solid var(--tinta); display: grid; gap: 6px; font-size: 15px; }
.ed-aviso { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 12px 14px; background: #F2C14E; border: 2px solid var(--tinta); font-weight: 600; font-size: 15px; }
.ed-aviso div { display: flex; gap: 8px; }
.ed-sec { display: grid; gap: 12px; }
.ed-sec-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 4px 10px; border-bottom: 2px solid var(--tinta); padding-bottom: 8px; }
.ed-sec-head h2 { margin: 0; font: 400 38px/.9 var(--display); }
.ed-sec-head span { font: 600 13px/1 var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-suave); }
.ed-campo { display: grid; gap: 5px; min-width: 0; }
.ed-campo > span { font: 600 12px/1 var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-suave); }
.ed-campo input, .ed-campo textarea, .ed-campo select {
  width: 100%; min-width: 0; font: 400 16px/1.35 var(--texto); color: var(--tinta);
  background: #fff; border: 2px solid var(--linea); border-radius: 10px; padding: 9px 11px;
}
.ed-campo textarea { min-height: 84px; resize: vertical; }
.ed-campo input:focus, .ed-campo textarea:focus, .ed-campo select:focus { border-color: var(--tinta); outline: none; }
.ed-dos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ed-item { border: 2px solid var(--tinta); background: var(--papel); display: grid; gap: 14px; padding: 12px; }
@media (min-width: 760px) { .ed-item { grid-template-columns: 220px 1fr; } .ed-item .ed-acciones { grid-column: 1 / -1; } }
.ed-fotos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; align-content: start; }
.ed-fotos.una { grid-template-columns: minmax(0, 1fr); max-width: 220px; }
.ed-slot { display: grid; gap: 6px; }
.ed-slot img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border: 2px solid var(--tinta); background: var(--papel-2); }
.ed-slot span { font: 600 11px/1 var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--tinta-suave); }
.ed-cambiar {
  position: relative; display: block; text-align: center; cursor: pointer;
  border: 2px solid var(--tinta); border-radius: 999px; padding: 7px 6px 6px;
  font: 600 12px/1 var(--label); letter-spacing: .08em; text-transform: uppercase;
}
.ed-cambiar:hover { background: var(--verde); }
.ed-cambiar input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.ed-cambiar:focus-within { outline: 3px solid var(--petroleo); outline-offset: 2px; }
.ed-campos { display: grid; gap: 10px; min-width: 0; align-content: start; }
.ed-acciones { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1.5px solid var(--linea); padding-top: 10px; }
.ed-acciones .orden { display: flex; gap: 6px; margin-right: auto; }
.ed-btn {
  border: 2px solid var(--tinta); background: transparent; border-radius: 999px;
  padding: 8px 12px 7px; font: 600 12px/1 var(--label); letter-spacing: .08em; text-transform: uppercase;
  text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
.ed-btn:disabled { opacity: .35; cursor: default; }
.ed-btn.borrar { border-color: var(--coral); color: var(--coral); }
.ed-btn.borrar.confirmar { background: var(--coral); color: #fff; }
.ed-btn.agregar { justify-self: start; background: var(--verde); }
.ed-estado { font: 600 12px/1 var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-suave); }
.ed-estado.sucio { color: var(--coral); }
/* ---------- Encendedor 3D ---------- */
.cta-3d {
  display: grid; grid-template-columns: 1fr 92px; gap: 12px; align-items: center;
  margin-bottom: 18px; text-decoration: none;
  background: var(--tinta); color: var(--papel); border: 2px solid var(--tinta); padding: 12px 12px 12px 14px;
  box-shadow: 4px 4px 0 var(--coral);
}
.cta-3d strong { display: block; font: 400 30px/1 var(--display); color: var(--coral); margin-bottom: 6px; }
.cta-3d small { font: 500 14px/1.35 var(--texto); }
.cta-3d img { width: 92px; aspect-ratio: 1 / 1; object-fit: cover; border: 2px solid var(--papel); background: var(--papel); }
.cat-head.e3d-head { background: var(--tinta); }
.cat-head.e3d-head h1 { color: var(--coral); }
.cat-head.e3d-head p { color: var(--papel); }
.cat-head.e3d-head .wrap { padding-right: 56px; }
.cat-head.e3d-head .vertical { color: var(--papel); }
.e3d { padding-bottom: 150px; }
.e3d-app { display: grid; gap: 22px; }
@media (min-width: 860px) {
  .e3d-app { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 36px; align-items: start; }
  .e3d-col { position: sticky; top: 130px; }
}
.e3d-col { display: grid; gap: 10px; min-width: 0; }
.e3d-stage {
  position: relative; height: min(62vh, 620px); min-height: 380px; overflow: hidden;
  border: 2px solid var(--tinta);
  background: radial-gradient(ellipse 70% 60% at 50% 38%, var(--papel), var(--linea));
}
.e3d-stage.drop { outline: 3px dashed var(--coral); outline-offset: -10px; }
#e3d-gl { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#e3d-gl:active { cursor: grabbing; }
.e3d-carga { position: absolute; inset: 0; margin: 0; display: grid; place-items: center; padding: 24px; text-align: center; font: 600 14px/1.4 var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); }
.e3d-hint { position: absolute; top: 10px; left: 12px; right: 12px; font-size: 12px; color: var(--tinta-suave); pointer-events: none; }
.e3d-fuego {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  background: var(--papel); color: var(--tinta); border: 2px solid var(--tinta); border-radius: 999px;
  padding: 10px 16px 9px 12px; font: 600 13px/1 var(--label); letter-spacing: .08em; text-transform: uppercase;
  box-shadow: 3px 3px 0 var(--tinta); user-select: none; -webkit-user-select: none; touch-action: none;
}
.e3d-fuego svg { width: 18px; height: 18px; color: var(--coral); }
.e3d-fuego[aria-pressed="true"] { background: var(--coral); color: #fff; box-shadow: 1px 1px 0 var(--tinta); }
.e3d-fuego[aria-pressed="true"] svg { color: #fff; }
.e3d-disenos { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.e3d-dis {
  position: relative; display: grid; gap: 5px; justify-items: center; align-content: start;
  padding: 0; border: 0; background: none; cursor: pointer; min-width: 0;
}
.e3d-dis img, .e3d-dis b {
  width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border: 2px solid var(--linea); background: var(--papel-2);
  display: grid; place-items: center; font: 400 30px/1 var(--display); color: var(--tinta-suave);
}
.e3d-dis span { font: 600 10.5px/1.15 var(--label); letter-spacing: .04em; text-transform: uppercase; text-align: center; }
.e3d-dis[aria-pressed="true"] img, .e3d-dis[aria-pressed="true"] b { border-color: var(--tinta); box-shadow: 3px 3px 0 var(--coral); }
.e3d-subir input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.e3d-subir:focus-within b, .e3d-subir:focus-within img { outline: 3px solid var(--petroleo); outline-offset: 2px; }
.seg.dos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.e3d-colores { display: flex; flex-wrap: wrap; gap: 10px; }
.e3d-col-btn { width: 34px; height: 34px; border-radius: 50%; background: var(--sw); border: 2px solid var(--papel); box-shadow: 0 0 0 1.5px var(--linea); padding: 0; }
.e3d-col-btn[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--tinta); }
.e3d-colname { font-style: normal; color: var(--tinta-suave); margin-left: auto; letter-spacing: .06em; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

function rutasPlanas(lista) {

}

const ICON_WPP = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2Z"/></svg>';
function textoConsulta(p, o = {}) {
  const lineas = [`¡Hola Diseridú! Quiero consultar por ${{ remeras: 'la remera', totes: 'la tote bag', encendedores: 'el encendedor' }[p.cat] || 'el producto'} "${p.nombre}".`];
  if (p.cat === 'remeras') {
    lineas.push(`• Color: ${o.color ? COLOR_TXT[o.color] : 'a definir'}`);
    lineas.push(`• Talle: ${o.talle || 'a definir'}`);
  }
  lineas.push(`• Cantidad: ${o.cant || 1}`);
  lineas.push('', '¿Me pasan precio y cómo coordinamos el envío?');
  return lineas.join('\n');
}
const fotoDe = (p, color) => p.cat === 'remeras' ? p.fotos[color || p.base] : p.foto;

function card(p) {
  const colores = p.cat === 'remeras' ? `<span class="dots" aria-label="Colores: blanca y negra"><i class="dot blanca"></i><i class="dot negra"></i></span>` : '';
  const color = p.cat === 'remeras' && filtroColor !== 'todas' ? filtroColor : null;
  return `<div class="card">
    <a class="card-link" href="#${p.id}" data-color="${color || ''}">
      <div class="ph"><img loading="lazy" src="${fotoDe(p, color)}" alt="${esc(p.nombre)}"><span class="tag">${esc(p.tag)}</span></div>
      <h3>${esc(p.nombre)}</h3>

    <a class="mini-wpp" href="${linkWpp(textoConsulta(p, { color }))}" target="_blank" rel="noopener">${ICON_WPP}Consultar</a>
  </div>`;
}

function vCategoria(cat) {

    <span class="vertical">${c.vertical}</span>

    <div class="toolbar"><span class="count">${lista.length} diseños</span>${filtro}</div>

      <div class="info">
        <h1>${esc(p.nombre)}</h1>

        <section class="desc" aria-label="Descripción">
          <h2>Descripción</h2>

}

function botonesColor(actual) {
  return ['blanca', 'negra'].map(c => `<button type="button" class="color" data-c="${c}" aria-pressed="${actual === c}"><span class="sw"></span>${COLOR_TXT[c]}</button>`).join('');
}

function resumen() {
  const p = PRODUCTOS.find(x => x.id === sel.id);
  const r = $('#resumen'); if (!r) return;
  const partes = p.cat === 'remeras' ? [COLOR_TXT[sel.color], sel.talle ? 'Talle ' + sel.talle : 'Sin talle'] : [];
  partes.push(sel.cant + (sel.cant === 1 ? ' unidad' : ' unidades'));
  r.innerHTML = `${esc(p.nombre)}<small>${partes.join(' · ')}</small>`;
  $('#consultar').href = linkWpp(textoConsulta(p, sel));
}

/* =========================================================
   Ruteo por #hash (funciona en GitHub Pages)
   ========================================================= */
function render() {
  e3dSalir();
  let e3d = false;
  let h = decodeURIComponent(location.hash.slice(1));
  if (ES_EDITOR && !h) h = 'editar';
  if (ES_EDITOR) {
    $('#modo').hidden = false;
    document.querySelectorAll('[data-modo]').forEach(a => { if ((a.dataset.modo === 'editar') === (h === 'editar')) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  }
  const prod = PRODUCTOS.find(p => p.id === h);
  let cat = null;
  if (prod) { vista.innerHTML = vProducto(prod, pendingColor); cat = prod.cat; resumen(); }
  else if (CATS[h]) { vista.innerHTML = vCategoria(h); cat = h; }
  else if (h === 'tu-diseno') { vista.innerHTML = vDiseno(); cat = h; genInit(); }
  else if (h === 'encendedor-3d') { vista.innerHTML = vEncendedor3D(); cat = 'encendedores'; e3d = true; e3dIniciar(); }
  else if (h === 'editar') { vista.innerHTML = vEditor(); cat = h; }
  else { vista.innerHTML = vInicio(); }
  pendingColor = null;
  if (!$('#lightbox').hidden) cerrarLightbox();
  document.querySelectorAll('.tab').forEach(t => {
    if (t.dataset.cat === cat) t.setAttribute('aria-current', 'page');
    else t.removeAttribute('aria-current');
  });
  const activa = document.querySelector('.tabs .tab[aria-current]');
  if (activa) activa.scrollIntoView({ inline: 'nearest', block: 'nearest' });
  tabsMas();
  document.body.style.paddingBottom = (prod || e3d || cat === 'tu-diseno' || cat === 'editar') ? '118px' : '';
  $('#pie-ig').href = `https://www.instagram.com/${INSTAGRAM}/`;
  $('#pie-ig').textContent = '@' + INSTAGRAM;
  window.scrollTo(0, 0);
}
let pendingColor = null;
function tabsMas() {
  const t = document.querySelector('.top .tabs');
  if (t) t.classList.toggle('mas', t.scrollLeft + t.clientWidth < t.scrollWidth - 4);
}
document.querySelector('.top .tabs').addEventListener('scroll', tabsMas, { passive: true });
window.addEventListener('resize', tabsMas);
window.addEventListener('hashchange', render);

/* =========================================================
   Interacción
   ========================================================= */
function setColor(c) {
  if (!sel || !sel.color) return;
  sel.color = c;
  const p = PRODUCTOS.find(x => x.id === sel.id);
  const box = $('#main-foto'), img = $('#main-img');
  box.classList.add('swap');
  const nueva = new Image();
  nueva.onload = nueva.onerror = () => { img.src = p.fotos[c]; img.alt = `${p.nombre} en remera ${COLOR_TXT[c].toLowerCase()}`; box.classList.remove('swap'); };
  nueva.src = p.fotos[c];
  document.querySelectorAll('.colores .color, .lb-colores .color').forEach(b => b.setAttribute('aria-pressed', b.dataset.c === c));
  document.querySelectorAll('[data-thumb]').forEach(b => b.setAttribute('aria-pressed', b.dataset.thumb === c));
  $('#color-txt').textContent = COLOR_TXT[c];
  if (!$('#lightbox').hidden) $('#lb-img').src = p.fotos[c];
  resumen();
}

document.addEventListener('click', e => {
  const t = e.target.closest('button, a');
  if (!t) return;
  if (t.closest('[data-e3d]')) return;
  if (t.closest('[data-gen]')) return genClick(t);
  if (t.closest('[data-ed]')) return edClick(t);
  if (t.matches('.card-link') && t.dataset.color) pendingColor = t.dataset.color;
  if (t.dataset.filtro) {
    filtroColor = t.dataset.filtro;
    vista.innerHTML = vCategoria('remeras');
    return;
  }
  if (t.matches('.color')) return setColor(t.dataset.c);
  if (t.dataset.thumb) return setColor(t.dataset.thumb);
  if (t.matches('.talle')) {
    sel.talle = t.dataset.talle;
    document.querySelectorAll('.talle').forEach(b => b.setAttribute('aria-pressed', b === t));
    $('#talle-txt').textContent = t.dataset.talle;
    return resumen();
  }
  if (t.dataset.qty) {
    sel.cant = Math.max(1, Math.min(50, sel.cant + Number(t.dataset.qty)));
    $('#cant').textContent = sel.cant;
    return resumen();
  }
  if (t.id === 'main-foto') return abrirLightbox();
  if (t.id === 'lb-cerrar') return cerrarLightbox();
});

/* Lightbox */
function abrirLightbox() {
  const p = PRODUCTOS.find(x => x.id === sel.id);
  verImagen(fotoDe(p, sel.color), p.nombre, '', p.cat === 'remeras' ? botonesColor(sel.color) : '');
}
function verImagen(src, titulo, nota = '', colores = '') {
  $('#lb-titulo').textContent = titulo;
  $('#lb-img').src = src;
  $('#lb-img').alt = titulo;
  $('#lb-colores').innerHTML = colores;
  $('#lb-nota').textContent = nota;
  $('#lb-nota').hidden = !nota;
  $('#lightbox').classList.remove('zoomed');
  $('#lightbox').hidden = false;
  document.body.style.overflow = 'hidden';
  $('#lb-cerrar').focus();
}
function cerrarLightbox() {
  $('#lightbox').hidden = true;
  document.body.style.overflow = '';
}
$('#lb-img').addEventListener('click', () => $('#lightbox').classList.toggle('zoomed'));
$('#lightbox').addEventListener('click', e => { if (e.target.classList.contains('lb-img')) cerrarLightbox(); });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('#lightbox').hidden) cerrarLightbox();
});


/* =========================================================
   Generador de estampas (Tu diseño)

const BASES = { blanca: 'base-blanca.jpg', negra: 'base-negra.jpg' };
const ZONA = { x: .31, y: .25, w: .38, h: .43 };   // área de impresión, en fracción de la foto
const ANCHO_FOTO_CM = 87;                           // la foto completa equivale a ~87 cm en un talle L
const gen = { src: null, img: null, w: 0, h: 0, color: 'blanca', talle: null, cant: 1,
              escala: 100, rot: 0, op: 100, x: .5, y: .465, zona: true, pos: 'centro' };

function vDiseno() {
  return `
  <section class="cat-head diseno">

        <label class="subir" id="gen-subir">
          <input type="file" id="gen-archivo" accept="image/png,image/jpeg,image/webp">
          <strong>${gen.src ? 'Cambiar imagen' : 'Elegir imagen'}</strong>
          <small>PNG con fondo transparente o JPG · hasta 20 MB</small>
        </label>
      </div>
      <div class="paso">
        <p class="paso-titulo"><b>2</b>Ajustá la estampa</p>

          <input type="range" id="gen-rot" min="-180" max="180" value="${gen.rot}"></div>
        <div class="slider"><label for="gen-op">Opacidad <output id="gen-op-v">${gen.op}%</output></label>

        <div class="seg" role="group" aria-label="Posición rápida">
          ${[['izq', 'Izquierda'], ['centro', 'Centro'], ['der', 'Derecha']].map(([k, t]) => `<button type="button" data-gpos="${k}" aria-pressed="${gen.pos === k}">${t}</button>`).join('')}
        </div>
        <div class="acciones-sec">

        <div class="opt-label">Cantidad</div>
        <div class="qty"><button type="button" data-gqty="-1" aria-label="Menos">−</button><output id="gen-cant">${gen.cant}</output><button type="button" data-gqty="1" aria-label="Más">+</button></div>

function genMedidas() {
  if (!gen.img) return null;
  const ar = gen.w / gen.h;
  let fw = ZONA.w, fh = ZONA.w / ar;
  if (fh > ZONA.h) { fh = ZONA.h; fw = fh * ar; }
  const k = gen.escala / 100;
  return { fw: fw * k, fh: fh * k };
}

function genPintar() {
  const capa = $('#gen-capa'); if (!capa) return;
  const m = genMedidas();
  if (m) {
    capa.style.left = (gen.x * 100) + '%';
    capa.style.top = (gen.y * 100) + '%';
    capa.style.width = (m.fw * 100) + '%';
    capa.style.opacity = gen.op / 100;
    capa.style.transform = `translate(-50%, -50%) rotate(${gen.rot}deg)`;
    const anchoCm = m.fw * ANCHO_FOTO_CM, altoCm = m.fh * ANCHO_FOTO_CM;
    const ppp = Math.round(gen.w / (anchoCm / 2.54));
    $('#gen-medida').textContent = `≈ ${Math.round(anchoCm)} × ${Math.round(altoCm)} cm (talle L) · ${ppp} ppp`;
    const cal = $('#gen-calidad');
    cal.hidden = false;
    cal.className = 'calidad ' + (ppp >= 200 ? 'buena' : ppp >= 120 ? 'media' : 'baja');
    cal.textContent = ppp >= 200 ? 'Buena resolución' : ppp >= 120 ? 'Resolución justa' : 'Resolución baja';
  }
  $('#gen-escala-v').textContent = gen.escala + '%';
  $('#gen-rot-v').textContent = gen.rot + '°';
  $('#gen-op-v').textContent = gen.op + '%';
  genResumen();
}

function textoDiseno() {
  const m = genMedidas();
  return [
    '¡Hola Diseridú! Quiero estampar un diseño propio.',
    `• Remera: ${COLOR_TXT[gen.color]}`,
    `• Talle: ${gen.talle || 'a definir'}`,
    `• Cantidad: ${gen.cant}`,
    `• Tamaño aprox.: ${m ? Math.round(m.fw * ANCHO_FOTO_CM) + ' × ' + Math.round(m.fh * ANCHO_FOTO_CM) + ' cm' : 'a definir'}`,
    '',
    'Les paso por acá el mockup y el archivo del diseño.'
  ].join('\n');
}

function genResumen() {
  const r = $('#gen-resumen'); if (!r) return;
  r.innerHTML = `Tu diseño<small>${[COLOR_TXT[gen.color], gen.talle ? 'Talle ' + gen.talle : 'Sin talle', gen.cant + (gen.cant === 1 ? ' unidad' : ' unidades')].join(' · ')}</small>`;
  $('#gen-consultar').href = linkWpp(textoDiseno());
}

function genCargar(file) {
  if (!file) return;
  if (!/^image\/(png|jpe?g|webp)$/.test(file.type)) { avisoGen('Ese formato no sirve. Usá PNG, JPG o WEBP.'); return; }
  if (file.size > 20 * 1024 * 1024) { avisoGen('La imagen pesa más de 20 MB.'); return; }
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      Object.assign(gen, { src: ev.target.result, img, w: img.naturalWidth, h: img.naturalHeight, escala: 100, rot: 0, op: 100, x: .5, y: .465, pos: 'centro' });
      vista.innerHTML = vDiseno();
      genInit();
    };
    img.onerror = () => avisoGen('No se pudo abrir la imagen.');
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

function avisoGen(msg) {
  const m = $('#gen-medida'); if (m) m.textContent = msg;
}

function genInit() {
  const estudio = $('#estudio'), capa = $('#gen-capa'), subir = $('#gen-subir');
  $('#gen-archivo').addEventListener('change', e => genCargar(e.target.files[0]));
  ['dragenter', 'dragover'].forEach(ev => subir.addEventListener(ev, e => { e.preventDefault(); subir.classList.add('arrastrando'); }));
  ['dragleave', 'drop'].forEach(ev => subir.addEventListener(ev, e => { e.preventDefault(); subir.classList.remove('arrastrando'); }));
  subir.addEventListener('drop', e => genCargar(e.dataTransfer.files[0]));
  estudio.addEventListener('dragover', e => e.preventDefault());
  estudio.addEventListener('drop', e => { e.preventDefault(); genCargar(e.dataTransfer.files[0]); });
  [['gen-escala', 'escala'], ['gen-rot', 'rot'], ['gen-op', 'op']].forEach(([id, k]) =>
    $('#' + id).addEventListener('input', e => { gen[k] = Number(e.target.value); genPintar(); }));

  // arrastrar y pellizcar
  const punteros = new Map();
  let inicio = null, pinch = null;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  capa.addEventListener('pointerdown', e => {
    if (punteros.size >= 2) return;
    try { capa.setPointerCapture(e.pointerId); } catch (_) {}
    punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (punteros.size === 1) inicio = { px: e.clientX, py: e.clientY, x: gen.x, y: gen.y };
    else { const [a, b] = [...punteros.values()]; pinch = { d: dist(a, b), escala: gen.escala }; }
    capa.classList.add('activa');
    e.preventDefault();
  });
  capa.addEventListener('pointermove', e => {
    if (!punteros.has(e.pointerId)) return;
    punteros.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const r = estudio.getBoundingClientRect();
    if (punteros.size === 1 && inicio) {
      gen.x = Math.max(.05, Math.min(.95, inicio.x + (e.clientX - inicio.px) / r.width));
      gen.y = Math.max(.05, Math.min(.95, inicio.y + (e.clientY - inicio.py) / r.height));
      if (gen.pos) { gen.pos = null; document.querySelectorAll('[data-gpos]').forEach(b => b.setAttribute('aria-pressed', 'false')); }
    } else if (punteros.size === 2 && pinch && pinch.d > 0) {
      const [a, b] = [...punteros.values()];
      gen.escala = Math.max(20, Math.min(200, Math.round(pinch.escala * dist(a, b) / pinch.d)));
      $('#gen-escala').value = gen.escala;
    }
    genPintar();
    e.preventDefault();
  });
  const fin = e => {
    try { capa.releasePointerCapture(e.pointerId); } catch (_) {}
    punteros.delete(e.pointerId);
    if (punteros.size === 1) { const p = [...punteros.values()][0]; inicio = { px: p.x, py: p.y, x: gen.x, y: gen.y }; pinch = null; }
    if (punteros.size === 0) { inicio = pinch = null; capa.classList.remove('activa'); }
  };
  capa.addEventListener('pointerup', fin);
  capa.addEventListener('pointercancel', fin);
  genPintar();
}

function genClick(t) {
  if (t.dataset.gc) {
    gen.color = t.dataset.gc;
    $('#gen-base').src = BASES[gen.color];
    $('#gen-base').alt = 'Remera ' + COLOR_TXT[gen.color].toLowerCase();
    document.querySelectorAll('[data-gc]').forEach(b => b.setAttribute('aria-pressed', b === t));
    return genResumen();
  }
  if (t.dataset.gtalle) {
    gen.talle = t.dataset.gtalle;
    document.querySelectorAll('[data-gtalle]').forEach(b => b.setAttribute('aria-pressed', b === t));
    $('#gen-talle-txt').textContent = gen.talle;
    return genResumen();
  }
  if (t.dataset.gqty) {
    gen.cant = Math.max(1, Math.min(50, gen.cant + Number(t.dataset.gqty)));
    $('#gen-cant').textContent = gen.cant;
    return genResumen();
  }
  if (t.dataset.gpos) {
    gen.pos = t.dataset.gpos;
    gen.x = { izq: .4, centro: .5, der: .6 }[gen.pos];
    gen.y = .465;
    if (gen.pos !== 'centro' && gen.escala > 60) { gen.escala = 45; $('#gen-escala').value = 45; }
    document.querySelectorAll('[data-gpos]').forEach(b => b.setAttribute('aria-pressed', b === t));
    return genPintar();
  }
  if (t.id === 'gen-zona-btn') {
    gen.zona = !gen.zona;
    $('#gen-zona').hidden = !gen.zona;
    return t.setAttribute('aria-pressed', gen.zona);
  }
  if (t.id === 'gen-reset') {
    Object.assign(gen, { escala: 100, rot: 0, op: 100, x: .5, y: .465, pos: 'centro' });
    ['escala', 'rot', 'op'].forEach(k => $('#gen-' + k).value = gen[k]);
    document.querySelectorAll('[data-gpos]').forEach(b => b.setAttribute('aria-pressed', b.dataset.gpos === 'centro'));
    return genPintar();
  }
  if (t.id === 'gen-descargar') return genDescargar(t);
}

function cargarImg(src) {
  return new Promise((ok, mal) => { const i = new Image(); i.onload = () => ok(i); i.onerror = mal; i.src = src; });
}

async function genDescargar(btn) {
  if (!gen.img) { avisoGen('Primero subí tu imagen.'); $('#gen-subir').scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
  btn.disabled = true;
  try {
    const S = 1200, c = document.createElement('canvas');
    c.width = c.height = S;
    const ctx = c.getContext('2d');
    ctx.drawImage(await cargarImg(BASES[gen.color]), 0, 0, S, S);
    const m = genMedidas();
    ctx.save();
    ctx.globalAlpha = gen.op / 100;
    ctx.translate(gen.x * S, gen.y * S);
    ctx.rotate(gen.rot * Math.PI / 180);
    ctx.drawImage(gen.img, -m.fw * S / 2, -m.fh * S / 2, m.fw * S, m.fh * S);
    ctx.restore();
    ctx.fillStyle = 'rgba(251, 248, 236, .9)';
    ctx.font = '400 44px Anton, Oswald, Impact, sans-serif';
    ctx.fillText('DISERIDÚ', 36, S - 40);
    ctx.font = '600 18px Oswald, Arial, sans-serif';
    ctx.fillText('@' + INSTAGRAM.toUpperCase(), S - 300, S - 44);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'diseridu-mockup.png';
    document.body.appendChild(a); a.click(); a.remove();
    verImagen(url, 'Tu mockup', 'Si no se descargó solo, mantené apretada la imagen (o clic derecho) y guardala. Después mandala por WhatsApp.');
  } catch (err) {
    avisoGen('No se pudo generar el mockup. Probá de nuevo.');
  }
  btn.disabled = false;
}

let DATOS_ORIGINAL = JSON.stringify(DATOS);
let edPlantilla = null;   // texto del index.html cargado por el usuario
let edArchivo = '';
let edSucio = false;
let edBorrando = null;

const slug = t => String(t).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'producto';
function idUnico(base, propio) {
  let id = base, n = 2;
  while (PRODUCTOS.some(p => p.id === id && p !== propio) || ['inicio', 'remeras', 'stickers', 'totes', 'encendedores', 'encendedor-3d', 'tu-diseno', 'editar'].includes(id)) id = `${base}-${n++}`;
  return id;
}

function leerBorrador() {
  try { const b = JSON.parse(localStorage.getItem('diseridu-borrador') || 'null'); return b && b.base === DATOS_ORIGINAL && JSON.stringify(b.datos) !== DATOS_ORIGINAL ? b : null; }
  catch (e) { return null; }
}
let guardarTimer;
function marcarCambio() {
  edSucio = true;
  const est = $('#ed-estado');
  if (est) { est.textContent = 'Cambios sin descargar'; est.classList.add('sucio'); }
  clearTimeout(guardarTimer);
  guardarTimer = setTimeout(() => {
    try { localStorage.setItem('diseridu-borrador', JSON.stringify({ base: DATOS_ORIGINAL, datos: DATOS })); } catch (e) {}
  }, 600);
}
window.addEventListener('beforeunload', e => { if (edSucio) { e.preventDefault(); e.returnValue = ''; } });

function vEditor() {
  const b = leerBorrador();
  const sec = cat => {

    return `<section class="ed-sec">

function edRepintar() {
  const y = window.scrollY;
  vista.innerHTML = vEditor();
  window.scrollTo(0, y);
}

function edClick(t) {
  const acc = t.dataset.accion;
  if (!acc) return;
  if (acc === 'exportar') return exportarIndex();
  if (acc === 'recuperar') {
    const b = leerBorrador(); if (!b) return;
    Object.assign(DATOS, b.datos); PRODUCTOS = DATOS.productos; WHATSAPP = DATOS.whatsapp; INSTAGRAM = DATOS.instagram;
    edSucio = true; return edRepintar();
  }
  if (acc === 'descartar') {
    try { localStorage.removeItem('diseridu-borrador'); } catch (e) {}
    return edRepintar();
  }
  if (acc === 'agregar') {
    const cat = t.dataset.cat;
    const nuevo = cat === 'remeras'
      ? { id: '', cat, nombre: 'Remera nueva', precio: null, tag: 'Nuevo', fotos: { blanca: 'base-blanca.jpg', negra: 'base-negra.jpg' }, base: 'negra', desc: 'Descripción del diseño.', nuevo: true }
      : cat === 'totes'
        ? { id: '', cat, nombre: 'Tote nueva', precio: null, tag: 'Nuevo', foto: 'tote-lisa.jpg', desc: 'Descripción de la tote bag.', nuevo: true }
      : { id: '', cat, nombre: 'Encendedor nuevo', precio: null, tag: 'Nuevo', foto: 'fuego-liso.jpg', desc: 'Descripción del encendedor.', nuevo: true };
    nuevo.id = idUnico(slug(nuevo.nombre), nuevo);
    const ultimo = PRODUCTOS.map(p => p.cat).lastIndexOf(cat);
    PRODUCTOS.splice(ultimo + 1, 0, nuevo);
    marcarCambio(); edRepintar();
    const el = document.querySelector(`[data-i="${PRODUCTOS.indexOf(nuevo)}"]`);
    if (el) { el.scrollIntoView({ block: 'center' }); el.querySelector('input').focus(); }
    return;
  }
  const item = t.closest('.ed-item'); if (!item) return;
  const i = Number(item.dataset.i), p = PRODUCTOS[i];
  if (acc === 'borrar') {
    if (edBorrando !== p) {
      edBorrando = p; edRepintar();
      setTimeout(() => { if (edBorrando === p) { edBorrando = null; if (location.hash === '#editar') edRepintar(); } }, 4000);
      return;
    }
    PRODUCTOS.splice(i, 1); edBorrando = null; marcarCambio(); return edRepintar();
  }
  if (acc === 'subir' || acc === 'bajar') {
    const hermanos = PRODUCTOS.map((x, k) => x.cat === p.cat ? k : -1).filter(k => k >= 0);
    const pos = hermanos.indexOf(i), destino = hermanos[pos + (acc === 'subir' ? -1 : 1)];
    if (destino == null) return;
    [PRODUCTOS[i], PRODUCTOS[destino]] = [PRODUCTOS[destino], PRODUCTOS[i]];
    marcarCambio(); return edRepintar();
  }
}

/* Campos de texto */
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.conf) {
    DATOS[el.dataset.conf] = el.value.trim().replace(el.dataset.conf === 'whatsapp' ? /\D/g : /^@/, '');
    WHATSAPP = DATOS.whatsapp; INSTAGRAM = DATOS.instagram;
    return marcarCambio();
  }
  if (!el.dataset.campo) return;
  const item = el.closest('.ed-item'); if (!item) return;
  const p = PRODUCTOS[Number(item.dataset.i)];
  const k = el.dataset.campo;
  if (k === 'precio') p.precio = el.value === '' ? null : Math.max(0, Number(el.value));
  else p[k] = el.value;
  if (k === 'nombre' && p.nuevo) {
    p.id = idUnico(slug(el.value), p);
    const ver = item.querySelector('a.ed-btn'); if (ver) ver.href = '#' + p.id;
  }
  marcarCambio();
});

/* Fotos: se achican a 1000 px y quedan guardadas dentro del index.html */
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'ed-cargar' && el.files[0]) return cargarIndex(el.files[0]);
  if (el.dataset.campo === 'base') return; // ya lo maneja 'input'
  if (!el.dataset.slot || !el.files[0]) return;
  const [i, clave] = el.dataset.slot.split(':');
  const p = PRODUCTOS[Number(i)];
  const file = el.files[0];
  if (!/^image\//.test(file.type)) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1000 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.84);
      if (clave === 'foto') p.foto = url; else p.fotos[clave] = url;
      el.closest('.ed-slot').querySelector('img').src = url;
      marcarCambio();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
});

function cargarIndex(file) {
  const r = new FileReader();
  r.onload = () => {
    const txt = String(r.result);
    const m = txt.match(/<script id="datos-tienda" type="application\/json">([\s\S]*?)<\/script>/);
    const msg = $('#ed-msg');
    if (!m) { msg.textContent = 'Ese archivo no tiene los datos de la tienda. Usá un index.html descargado desde este editor.'; msg.className = 'ed-msg error'; return; }
    let d;
    try { d = JSON.parse(m[1]); } catch (err) { msg.textContent = 'No pude leer los datos de ese archivo.'; msg.className = 'ed-msg error'; return; }
    for (const k of Object.keys(DATOS)) delete DATOS[k];
    Object.assign(DATOS, d);
    DATOS.productos = rutasPlanas(DATOS.productos.filter(p => CATS[p.cat]));
    PRODUCTOS = DATOS.productos; WHATSAPP = DATOS.whatsapp; INSTAGRAM = DATOS.instagram;
    DATOS_ORIGINAL = JSON.stringify(DATOS);
    edPlantilla = txt; edArchivo = file.name; edSucio = false;
    edRepintar();
    const m2 = $('#ed-msg'); if (m2) { m2.textContent = `Listo: ${PRODUCTOS.length} productos cargados.`; m2.className = 'ed-msg'; }
  };
  r.readAsText(file);
}

async function obtenerPlantilla() {
  if (edPlantilla) return edPlantilla;
  if (ES_EDITOR) {
    const r = await fetch('plantilla.txt');
    if (!r.ok) throw new Error('plantilla');
    return r.text();
  }
  return FUENTE;
}

async function exportarIndex() {
  const est = $('#ed-estado');
  const aviso = (t, sucio) => { if (est) { est.textContent = t; est.classList.toggle('sucio', !!sucio); } };
  PRODUCTOS.forEach(p => { delete p.nuevo; });
  DATOS.productos = PRODUCTOS;
  let plantilla;
  try { plantilla = await obtenerPlantilla(); } catch (err) { return aviso('No pude armar el archivo. Recargá la página y probá de nuevo.', true); }
  const json = JSON.stringify(DATOS, null, 1).replace(/</g, '\\u003c');
  const html = plantilla.replace(/(<script id="datos-tienda" type="application\/json">)[\s\S]*?(<\/script>)/, (m, a, b) => `${a}\n${json}\n${b}`);
  const kb = Math.round(new Blob([html]).size / 1024);
  const listo = () => {
    edSucio = false;
    try { localStorage.removeItem('diseridu-borrador'); } catch (e) {}
    aviso(`Descargado (${kb} KB). Subilo a GitHub.`);
  };
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;

    catch (err) {

      else if (err && err.code === 'rate_limited') aviso('Ya hay una descarga abierta. Esperá un momento.', true);
      else aviso('No se pudo descargar desde acá.', true);
    }
    return;
  }
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'index.html';
  document.body.appendChild(a); a.click(); a.remove();

}

    if (!stickerImg.naturalWidth) { stickerMesh.visible = false; return; }
    const nw = stickerImg.naturalWidth, nh = stickerImg.naturalHeight;
    const d = stickerDims(), h = d.h, arcLen = d.w;
    const yc = (Y_MIN + h / 2) + E.pos * ((Y_MAX - h / 2) - (Y_MIN + h / 2));
    $('#e3d-pos-v').textContent = Math.round((yc - h / 2) * 10) + ' mm de la base';
    E.medidas = mm(h) + ' × ' + mm(arcLen) + ' mm';
    const sx = (arcLen / h) / (nw / nh);
    $('#e3d-medidas').textContent = 'Sticker: ' + E.medidas + ' (alto × ancho)' + (Math.abs(sx - 1) > 0.02 ? ' · imagen estirada' : '');
    const full = arcLen >= PERIM - 1e-3;
    stickerMesh.geometry.dispose();
    stickerMesh.geometry = wrapGeo(FRONT_U + E.turn / 360, arcLen / PERIM, yc - h / 2, yc + h / 2);
    let H = Math.min(4096, Math.max(1024, nh)), W = Math.round(H * arcLen / h);
    if (W > 4096) { W = 4096; H = Math.round(W * h / arcLen); }
    H = Math.round(H);
    stickerCanvas.width = W; stickerCanvas.height = H;
    const g = stickerCanvas.getContext('2d');
    g.clearRect(0, 0, W, H);
    const rad = full ? 0 : H * 0.035, b = E.border ? H * 0.03 : 0;
    if (b) { roundRect(g, 0, 0, W, H, rad); g.fillStyle = '#ffffff'; g.fill(); }
    g.save();
    roundRect(g, b, b, W - 2 * b, H - 2 * b, Math.max(0, rad - b * 0.5)); g.clip();
    g.imageSmoothingQuality = 'high';
    g.drawImage(stickerImg, b, b, W - 2 * b, H - 2 * b);
    g.restore();
    stickerTex.needsUpdate = true;
    stickerMat.roughness = E.gloss ? 0.18 : 0.7;
    stickerMat.clearcoat = E.gloss ? 1 : 0;
    stickerMat.needsUpdate = true;
    stickerMesh.visible = true;
    e3dResumen();
  }
  stickerImg.onload = rebuildSticker;

  /* Válvula y boquilla */
  const valveG = new THREE.Group(); lighter.add(valveG);
  valveG.add(cyl(0.08, 1.0, 5.55, steel, NOZZLE_X, 16));
  valveG.add(cyl(0.17, 0.08, 6.32, darkSteel, NOZZLE_X, 24));
  valveG.add(cyl(0.11, 0.3, 6.4, brass, NOZZLE_X, 20));

  /* Llama */
  const flameVS = `
    uniform float uTime; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      vUv = uv; vec3 p = position; float h = p.y;
      p.x += sin(h*4.0 - uTime*9.0)*0.05*h + sin(uTime*23.0)*0.012*h;
      p.z += cos(h*3.0 - uTime*7.0)*0.04*h;
      vec4 mv = modelViewMatrix*vec4(p,1.0);
      vN = normalize(normalMatrix*normal); vV = normalize(-mv.xyz);
      gl_Position = projectionMatrix*mv;
    }`;
  const flameFS = `
    uniform vec3 uCore; uniform vec3 uEdge; uniform float uGain;
    varying vec2 vUv; varying vec3 vN; varying vec3 vV;
    void main(){
      float f = abs(dot(normalize(vN), normalize(vV)));
      float t = vUv.y;
      vec3 col = mix(uCore, uEdge, smoothstep(0.05, 0.85, t));
      float a = pow(f, 1.5) * (1.0 - smoothstep(0.6, 1.0, t)) * smoothstep(0.0, 0.06, t) * uGain;
      gl_FragColor = vec4(col*a, a);
    }`;
  function flameMesh(height, radius, core, edge, gain) {
    const pts = [];
    for (let i = 0; i <= 24; i++) {
      const t = i / 24;
      const r = radius * Math.pow(Math.sin(Math.PI * Math.pow(t, 0.5)), 0.85) * (1 - 0.25 * t);
      pts.push(new THREE.Vector2(Math.max(r, 0.0001), t * height));
    }
    const mat = new THREE.ShaderMaterial({
      uniforms: { uTime: { value: 0 }, uCore: { value: new THREE.Color(core) }, uEdge: { value: new THREE.Color(edge) }, uGain: { value: gain } },
      vertexShader: flameVS, fragmentShader: flameFS, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    const m = new THREE.Mesh(new THREE.LatheGeometry(pts, 32), mat); m.renderOrder = 4; return m;
  }
  const flameG = new THREE.Group(); flameG.position.set(NOZZLE_X, CAP_TOP - 0.1, 0); valveG.add(flameG);
  const flameOuter = flameMesh(2.3, 0.3, 0xffd27a, 0xff5a12, 1.6);
  const flameInner = flameMesh(0.55, 0.13, 0x3d6bff, 0x7fb0ff, 1.4);
  flameG.add(flameOuter, flameInner);
  const fireLight = new THREE.PointLight(0xff8a3a, 0, 14, 2); fireLight.position.set(NOZZLE_X, CAP_TOP + 0.9, 0.2); valveG.add(fireLight);

  /* Rueda de chispa */
  const wheelG = new THREE.Group(); wheelG.position.set(WHEEL_X, WHEEL_Y, 0); lighter.add(wheelG);
  const wheelSpin = new THREE.Group(); wheelG.add(wheelSpin);
  function zCyl(r, h, z, mat) { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, 48), mat); m.rotation.x = Math.PI / 2; m.position.z = z; return m; }
  wheelSpin.add(zCyl(0.39, 0.3, 0, knurlMat), zCyl(0.43, 0.13, 0.215, rimMat), zCyl(0.43, 0.13, -0.215, rimMat));
  wheelG.add(zCyl(0.065, 1.2, 0, steel));

  /* Palanca de gas */
  const leverG = new THREE.Group(); lighter.add(leverG);
  const leverPivot = new THREE.Group(); leverPivot.position.set(0.5, 6.2, 0); leverG.add(leverPivot);
  const leverInner = new THREE.Group(); leverInner.position.set(-0.5, -6.2, 0); leverPivot.add(leverInner);
  const lp = new THREE.Shape();
  lp.moveTo(0.4, 6.17); lp.lineTo(1.22, 6.17); lp.quadraticCurveTo(1.33, 6.2, 1.31, 6.33);
  lp.lineTo(1.27, 6.42); lp.quadraticCurveTo(1.24, 6.47, 1.16, 6.48); lp.lineTo(0.62, 6.56); lp.lineTo(0.4, 6.56); lp.lineTo(0.4, 6.17);
  const LEVER_D = 1.02;
  const leverGeo = new THREE.ExtrudeGeometry(lp, { depth: LEVER_D, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.03, bevelSegments: 3, curveSegments: 12 });
  leverGeo.translate(0, 0, -LEVER_D / 2);
  leverInner.add(new THREE.Mesh(leverGeo, leverMat));
  for (let i = 0; i < 6; i++) {
    const x = 0.7 + i * 0.085, y = 6.555 - (x - 0.62) * (0.08 / 0.54) + 0.02;
    const r = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.035, LEVER_D - 0.12), leverMat); r.position.set(x, y, 0); leverInner.add(r);
  }

  /* Capuchón plástico */
  const hoodG = new THREE.Group(); lighter.add(hoodG);
  const CAP_A = BODY_A + BODY_BEVEL - 0.02, CAP_B = BODY_B + BODY_BEVEL - 0.02, CAP_BEV = 0.035;
  const capPoly = sePts(CAP_A, CAP_B, 128);
  const holePath = () => { const p = new THREE.Path(); p.absellipse(NOZZLE_X, 0, 0.21, 0.19, 0, Math.PI * 2, true); return p; };
  function capPart(poly, y0, y1, withHole) {
    const s = new THREE.Shape(poly); if (withHole) s.holes.push(holePath());
    const g = vertical(s, y1 - y0 - 2 * CAP_BEV, { bevelEnabled: true, bevelThickness: CAP_BEV, bevelSize: CAP_BEV, bevelSegments: 3, curveSegments: 24 });
    g.translate(0, y0 + CAP_BEV, 0);
    return new THREE.Mesh(g, capMat);
  }
  const lower = clip(capPoly, 1, 0, CAP_RIGHT);
  const block = clip(capPoly, 1, 0, SLOT_L);
  const wallBand = clip(clip(capPoly, 1, 0, CAP_RIGHT), -1, 0, -SLOT_L);
  hoodG.add(capPart(lower, CAP_Y0, CAP_MID + 0.04, true));
  hoodG.add(capPart(block, CAP_MID - 0.04, CAP_TOP, true));
  hoodG.add(capPart(clip(wallBand, 0, 1, -SLOT_Z), CAP_MID - 0.04, CAP_TOP - 0.06, false));
  hoodG.add(capPart(clip(wallBand, 0, -1, -SLOT_Z), CAP_MID - 0.04, CAP_TOP - 0.06, false));
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.9, 32, 1, true), holeMat);
  tube.scale.z = 0.9; tube.position.set(NOZZLE_X, CAP_TOP - 0.47, 0); hoodG.add(tube);
  const slotGeo = new THREE.ShapeGeometry(rr(new THREE.Shape(), 0.085, 0.32, 0.042), 8);
  const slotX = -1.03, slotZ = seDepth(CAP_A + CAP_BEV, CAP_B + CAP_BEV, slotX);
  const gx = SE_N * Math.pow(Math.abs(slotX), SE_N - 1) / Math.pow(CAP_A + CAP_BEV, SE_N), gz = SE_N * Math.pow(slotZ, SE_N - 1) / Math.pow(CAP_B + CAP_BEV, SE_N);
  const slotAng = Math.atan2(-gx, gz);
  [1, -1].forEach(sz => {
    const m = new THREE.Mesh(slotGeo, holeMat);
    m.position.set(slotX, 6.48, sz * (slotZ + 0.004));
    m.rotation.y = sz > 0 ? slotAng : Math.PI - slotAng;
    hoodG.add(m);
  });

  /* Sombra de contacto */
  const shadowTex = canvasTex(128, 128, (g, w, h) => { const gr = g.createRadialGradient(64, 64, 4, 64, 64, 64); gr.addColorStop(0, 'rgba(0,0,0,.55)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, w, h); });
  const shadow = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 2.8), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.002; scene.add(shadow);

  /* Chispas */
  const NS = 70;
  const sPos = new Float32Array(NS * 3).fill(-999), sVel = new Float32Array(NS * 3), sLife = new Float32Array(NS);
  const sGeo = new THREE.BufferGeometry(); sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  const dotTex = canvasTex(32, 32, g => { const gr = g.createRadialGradient(16, 16, 0, 16, 16, 16); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.35, 'rgba(255,200,110,.9)'); gr.addColorStop(1, 'rgba(255,120,30,0)'); g.fillStyle = gr; g.fillRect(0, 0, 32, 32); });
  const sparks = new THREE.Points(sGeo, new THREE.PointsMaterial({ size: 0.16, map: dotTex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, color: 0xffffff }));
  sparks.frustumCulled = false; sparks.renderOrder = 5; scene.add(sparks);
  const sparkOrigin = new THREE.Vector3();
  function emitSparks(n) {
    sparkOrigin.set(-0.32, 0.18, 0); wheelG.localToWorld(sparkOrigin);
    for (let i = 0; i < NS && n > 0; i++) {
      if (sLife[i] > 0) continue;
      sPos[i * 3] = sparkOrigin.x; sPos[i * 3 + 1] = sparkOrigin.y; sPos[i * 3 + 2] = sparkOrigin.z;
      sVel[i * 3] = -1.2 - Math.random() * 2.6; sVel[i * 3 + 1] = 1.2 + Math.random() * 3; sVel[i * 3 + 2] = (Math.random() - .5) * 2;
      sLife[i] = 0.25 + Math.random() * 0.35; n--;
    }
  }
  function updateSparks(dt) {
    for (let i = 0; i < NS; i++) {
      if (sLife[i] <= 0) continue;
      sLife[i] -= dt;
      if (sLife[i] <= 0) { sPos[i * 3 + 1] = -999; continue; }
      sVel[i * 3 + 1] -= 7 * dt;
      sPos[i * 3] += sVel[i * 3] * dt; sPos[i * 3 + 1] += sVel[i * 3 + 1] * dt; sPos[i * 3 + 2] += sVel[i * 3 + 2] * dt;
    }
    sGeo.attributes.position.needsUpdate = true;
  }

  /* Color de la carcasa */
  function setColor(i) {
    E.color = i;
    bodyFront.color.set(E3D_COLORES[i][1]).convertSRGBToLinear();
    $('#e3d-colname').textContent = E3D_COLORES[i][0];
    document.querySelectorAll('[data-e3c]').forEach(b => b.setAttribute('aria-pressed', String(Number(b.dataset.e3c) === i)));
    e3dResumen();
  }
  setColor(E.color);

  /* Diseño */
  let urlPropia = null;
  function usarDiseno(id) {
    E.diseno = id; E.propio = null;
    stickerImg.src = E3D_DISENOS.find(d => d.id === id).src;
    document.querySelectorAll('.e3d-dis').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.dis === id)));
  }
  function cargarPropio(file) {
    if (!file || !/^image\//.test(file.type)) return;
    const r = new FileReader();
    r.onload = ev => {
      E.propio = ev.target.result; E.propioNombre = file.name || 'imagen';
      stickerImg.src = E.propio;
      E.scale = 1; $('#e3d-scale').value = 100; $('#e3d-scale-v').textContent = '100%';
      const lab = document.querySelector('.e3d-subir');
      lab.querySelector('b, img').outerHTML = `<img src="${E.propio}" alt="">`;
      lab.querySelector('span').textContent = 'Tu diseño';
      document.querySelectorAll('.e3d-dis').forEach(b => b.setAttribute('aria-pressed', String(b === lab)));
    };
    r.readAsDataURL(file);
  }
  if (E.propio) stickerImg.src = E.propio; else stickerImg.src = E3D_DISENOS.find(d => d.id === E.diseno).src;
  syncFitUI();

  const raiz = document.querySelector('.e3d[data-e3d]');
  on(raiz, 'click', e => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.dis) return usarDiseno(t.dataset.dis);
    if (t.dataset.e3c) return setColor(Number(t.dataset.e3c));
    if (t.dataset.e3m) {
      E.mode = t.dataset.e3m;
      if (E.fit === 'fill') E.w = E.mode === 'wrap' ? PERIM : PERIM * 0.5;
      document.querySelectorAll('[data-e3m]').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
      syncFitUI(); return rebuildSticker();
    }
    if (t.dataset.e3f) {
      E.fit = t.dataset.e3f;
      if (E.fit === 'fill') { E.h = H_MAX; E.w = E.mode === 'wrap' ? PERIM : PERIM * 0.5; }
      document.querySelectorAll('[data-e3f]').forEach(b => b.setAttribute('aria-pressed', String(b === t)));
      syncFitUI(); return rebuildSticker();
    }
    if (t.id === 'e3d-borde') { E.border = !E.border; t.setAttribute('aria-pressed', String(E.border)); return rebuildSticker(); }
    if (t.id === 'e3d-brillo') { E.gloss = !E.gloss; t.setAttribute('aria-pressed', String(E.gloss)); return rebuildSticker(); }
    if (t.id === 'e3d-girar') { controls.autoRotate = !controls.autoRotate; return t.setAttribute('aria-pressed', String(controls.autoRotate)); }
    if (t.id === 'e3d-centrar') { controls.target.set(0, BASE_Y, 0); camera.position.copy(HOME_POS); return; }
  });
  on(raiz, 'input', e => {
    const el = e.target, v = Number(el.value);
    if (el.id === 'e3d-scale') { E.scale = v / 100; $('#e3d-scale-v').textContent = v + '%'; }
    else if (el.id === 'e3d-h') { E.h = v / 10; $('#e3d-h-v').textContent = v + ' mm'; }
    else if (el.id === 'e3d-w') { E.w = v / 10; $('#e3d-w-v').textContent = v + ' mm'; }
    else if (el.id === 'e3d-pos') { E.pos = v / 100; }
    else if (el.id === 'e3d-turn') { E.turn = v; $('#e3d-turn-v').textContent = v + '°'; }
    else return;
    rebuildSticker();
  });
  on($('#e3d-archivo'), 'change', e => { cargarPropio(e.target.files[0]); e.target.value = ''; });
  on(window, 'paste', e => {
    const f = e.clipboardData && e.clipboardData.files && e.clipboardData.files[0];
    if (f) { e.preventDefault(); cargarPropio(f); }
  });
  ['dragenter', 'dragover'].forEach(ev => on(stage, ev, e => { e.preventDefault(); stage.classList.add('drop'); }));
  ['dragleave', 'drop'].forEach(ev => on(stage, ev, e => { e.preventDefault(); stage.classList.remove('drop'); }));
  on(stage, 'drop', e => cargarPropio(e.dataTransfer && e.dataTransfer.files[0]));

  /* Prender */
  let holding = false, wheelVel = 0;
  const fireBtn = $('#e3d-fuego'), fireTxt = $('#e3d-fuego-txt');
  function press() { if (holding) return; holding = true; wheelVel = 22; emitSparks(30); fireBtn.setAttribute('aria-pressed', 'true'); fireTxt.textContent = 'Prendido'; }
  function release() { if (!holding) return; holding = false; fireBtn.setAttribute('aria-pressed', 'false'); fireTxt.textContent = 'Mantené para prender'; }
  on(fireBtn, 'pointerdown', e => { e.preventDefault(); try { fireBtn.setPointerCapture(e.pointerId); } catch (_) {} press(); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => on(fireBtn, ev, release));
  on(fireBtn, 'contextmenu', e => e.preventDefault());
  on(fireBtn, 'keydown', e => { if ((e.code === 'Space' || e.code === 'Enter') && !e.repeat) { e.preventDefault(); press(); } });
  on(fireBtn, 'keyup', e => { if (e.code === 'Space' || e.code === 'Enter') release(); });
  on(window, 'blur', release);

  /* Descargar la vista actual */
  on($('#e3d-descargar'), 'click', async () => {
    const btn = $('#e3d-descargar'); btn.disabled = true;
    try {
      renderer.render(scene, camera);
      const S = 1080, c = document.createElement('canvas'); c.width = c.height = S;
      const g = c.getContext('2d');
      const grad = g.createRadialGradient(S / 2, S * .4, 40, S / 2, S * .45, S * .75);
      grad.addColorStop(0, '#FBF8EC'); grad.addColorStop(1, '#E2DBC6');
      g.fillStyle = grad; g.fillRect(0, 0, S, S);
      const k = Math.min(S / canvas.width, (S - 90) / canvas.height);
      const w = canvas.width * k, h = canvas.height * k;
      g.drawImage(canvas, (S - w) / 2, (S - 90 - h) / 2 + 10, w, h);
      g.fillStyle = '#221C26';
      g.font = '400 46px Anton, Oswald, Impact, sans-serif'; g.fillText('DISERIDÚ', 36, S - 36);
      g.font = '600 18px Oswald, Arial, sans-serif';
      const ig = '@' + INSTAGRAM.toUpperCase(); g.fillText(ig, S - 36 - g.measureText(ig).width, S - 44);
      const blob = await new Promise(ok => c.toBlob(ok, 'image/png'));
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'diseridu-encendedor.png';
      document.body.appendChild(a); a.click(); a.remove();
      verImagen(url, 'Tu fuego 3D', 'Si no se descargó solo, mantené apretada la imagen (o clic derecho) y guardala. Después mandala por WhatsApp.');
    } catch (err) {
      $('#e3d-medidas').textContent = 'No se pudo generar la imagen. Probá de nuevo.';
    }
    btn.disabled = false;
  });

  /* Tamaño */
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight; if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  const ro = new ResizeObserver(resize); ro.observe(stage); resize();

  /* Bucle */
  let last = performance.now(), time = 0, leverAmt = 0, flameAmt = 0, raf = 0;
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
    leverAmt += ((holding ? 1 : 0) - leverAmt) * Math.min(1, dt * 18);
    leverPivot.rotation.z = -0.12 * leverAmt;
    valveG.position.y = 0.06 * leverAmt;
    wheelSpin.rotation.z -= wheelVel * dt; wheelVel *= Math.exp(-dt * 3.5);
    const want = (holding && leverAmt > 0.4) ? 1 : 0;
    flameAmt += (want - flameAmt) * Math.min(1, dt * (want ? 9 : 14));
    const flick = 1 + 0.06 * Math.sin(time * 17) + 0.04 * Math.sin(time * 31 + 1) + 0.03 * Math.sin(time * 53 + 2);
    flameG.visible = flameAmt > 0.01;
    flameG.scale.set(0.85 + 0.15 * flameAmt, Math.max(0.001, flameAmt * flick), 0.85 + 0.15 * flameAmt);
    flameOuter.material.uniforms.uTime.value = time; flameInner.material.uniforms.uTime.value = time;
    fireLight.intensity = 2.4 * flameAmt * flick;
    if (holding && wheelVel > 6 && Math.random() < 0.4) emitSparks(2);
    updateSparks(dt);
    controls.update();
    renderer.render(scene, camera);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  return function apagar() {
    cancelAnimationFrame(raf);
    ro.disconnect();
    limpiar.forEach(f => f());
    controls.dispose();
    scene.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) [].concat(o.material).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
    });
    if (scene.environment) scene.environment.dispose();
    pmrem.dispose();
    renderer.dispose();
    try { renderer.forceContextLoss(); } catch (e) {}
    if (urlPropia) URL.revokeObjectURL(urlPropia);
  };
}

/* WhatsApp */
function linkWpp(txt) { return `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(txt)}`; }

render();
</script>
