<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff2e8b">
<meta name="description" content="Diseridú — remeras, gráficas, stickers y accesorios estampados.">
<title>Diseridú</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#e8588a;
    --pink-dot:rgba(255,255,255,.26);
    --pink-hot:#ff2e8b;
    --logo:#ff4d88;
    --cream:#fdf8e4;
    --ink:#141414;
    --yellow:#ffd23f;
    --grey:#5a5a5a;
    --card-w:min(66vw, 340px);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;
    background-color:var(--pink);
    background-image:radial-gradient(var(--pink-dot) 1.7px, transparent 2px);
    background-size:22px 22px;
    color:var(--ink);
    font-family:"Archivo Black", Impact, system-ui, sans-serif;
    -webkit-tap-highlight-color:transparent;
    overflow-x:hidden;
  }
  body.lock{overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  /* ---------- Header ---------- */
  .top{padding:calc(28px + env(safe-area-inset-top)) 16px 34px}
  .logo{
    display:inline-block;
    background:var(--logo);
    padding:clamp(18px,5vw,28px) clamp(22px,7vw,40px);
    font-size:clamp(30px,10vw,48px);
    letter-spacing:.04em;line-height:1;
    color:#fff4d4;
    text-shadow:2px 2px 0 rgba(255,210,63,.55);
    user-select:none;
  }

  /* ---------- Subcategorías de Remeras ---------- */
  .subcats{
    display:flex;gap:10px;padding:18px 16px 0;
    overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;
  }
  .subcats::-webkit-scrollbar{display:none}
  .subcats[hidden]{display:none}
  .subcats .chip{font-size:10px;padding:9px 14px}
  .chip small{font-family:ui-monospace, Menlo, monospace;font-size:9px;letter-spacing:0;opacity:.6}
  .chip.on small{opacity:.85}

  /* ---------- Categorías ---------- */
  .cats{
    background:var(--pink-hot);
    display:flex;gap:12px;
    padding:14px 16px 16px;
    overflow-x:auto;scroll-snap-type:x proximity;
    scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;scroll-snap-align:center;
    font-family:"Rubik Mono One", "Archivo Black", sans-serif;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    background:var(--cream);
    border:3px solid var(--ink);border-radius:999px;
    padding:10px 18px;
    box-shadow:3px 3px 0 var(--ink);
    transition:transform .12s, box-shadow .12s;
  }
  .chip:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .chip.on{background:var(--ink);color:var(--yellow);box-shadow:none}

  /* ---------- Carrusel ---------- */
  main{flex:1;display:flex;flex-direction:column;align-items:center;padding:44px 0 24px}
  .stage{position:relative;width:var(--card-w)}
  .viewport{
    overflow:hidden;
    touch-action:pan-y;
    outline:2px dotted rgba(255,255,255,.28);outline-offset:14px;
  }
  .track{display:flex;transition:transform .45s cubic-bezier(.2,.8,.2,1);will-change:transform}
  .slide{flex:0 0 100%;padding:0 10px 12px 0}
  .card{
    background:var(--cream);
    border:4px solid var(--ink);
    box-shadow:8px 8px 0 var(--ink);
    user-select:none;
  }
  .card-art{
    position:relative;aspect-ratio:5/5.6;
    background:repeating-linear-gradient(-18deg,var(--bg) 0 34px,var(--bg2) 34px 68px);
    border-bottom:4px solid var(--ink);
    display:grid;place-items:center;overflow:hidden;cursor:pointer;
  }
  .card-art svg,.card-art img{width:88%;height:88%;object-fit:contain;display:block;pointer-events:none}
  .card-art.photo{background:#000}
  .card-art.photo img{width:100%;height:100%;object-fit:cover}
  .sheet .card-art.photo img{width:100%;height:100%;object-fit:contain}
  .tag{
    position:absolute;top:12px;left:12px;z-index:1;
    font-family:Anton, Impact, sans-serif;font-size:14px;letter-spacing:.02em;
    background:var(--cream);border:3px solid var(--ink);padding:3px 8px;
  }
  .card-body{padding:14px 14px 18px}
  .card-body h2{font-size:clamp(16px,5vw,21px);line-height:.98;text-transform:uppercase}
  .price{
    font-family:Anton, Impact, sans-serif;font-size:14px;letter-spacing:.03em;
    color:var(--grey);text-transform:uppercase;margin:8px 0 14px;
  }
  .price.has{color:var(--ink);font-size:18px}
  .btn-ver{
    font-family:Anton, Impact, sans-serif;font-size:15px;letter-spacing:.02em;
    background:var(--pink);border:3px solid var(--ink);
    padding:8px 16px;box-shadow:5px 5px 0 var(--ink);
    transition:transform .12s, box-shadow .12s;
  }
  .btn-ver:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}

  .arrow{
    position:absolute;top:50%;z-index:2;
    width:44px;height:62px;margin-top:-31px;
    background:var(--cream);border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--ink);
    font-family:"Rubik Mono One", sans-serif;font-size:16px;
    display:grid;place-items:center;
    transition:transform .12s, box-shadow .12s;
  }
  .arrow:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
  .arrow.prev{left:-34px}
  .arrow.next{right:-34px}
  .arrow[hidden]{display:none}

  .meta{margin-top:30px;display:flex;flex-direction:column;align-items:center;gap:10px}
  .counter{font-family:"Rubik Mono One", sans-serif;font-size:12px;color:var(--cream);letter-spacing:.1em}
  .dots{display:flex;gap:7px}
  .dots i{width:9px;height:9px;background:var(--cream);border:2px solid var(--ink);opacity:.55;transition:all .2s}
  .dots i.on{background:var(--yellow);opacity:1;width:22px}

  .empty .btn-ver{color:var(--ink);text-decoration:none;display:inline-block}
  .empty{
    aspect-ratio:5/7.6;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;text-align:center;padding:20px;
    background:var(--cream);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);
    font-size:18px;text-transform:uppercase;
  }

  footer{
    text-align:center;padding:18px 16px calc(22px + env(safe-area-inset-bottom));
    font-family:Anton, Impact, sans-serif;letter-spacing:.04em;color:var(--cream);font-size:14px;
  }
  footer a{color:var(--cream)}

  /* ---------- Hoja de artículo ---------- */
  .backdrop{
    position:fixed;inset:0;background:rgba(20,20,20,.55);z-index:10;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:11;
    max-height:90vh;max-height:90dvh;overflow-y:auto;overscroll-behavior:contain;
    background:var(--cream);border-top:4px solid var(--ink);
    transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .open .backdrop{opacity:1;pointer-events:auto}
  .open .sheet{transform:none}
  .sheet-inner{max-width:520px;margin:0 auto}
  .sheet .card-art{aspect-ratio:1/.85;cursor:default}
  .sheet .card-art svg,.sheet .card-art img{width:72%;height:88%}
  .close{
    position:absolute;top:12px;right:12px;z-index:2;
    width:42px;height:42px;background:var(--cream);border:3px solid var(--ink);
    box-shadow:3px 3px 0 var(--ink);font-family:"Rubik Mono One",sans-serif;font-size:14px;
  }
  .sheet-body{padding:18px 18px 22px}
  .sheet-body h2{font-size:24px;line-height:1;text-transform:uppercase}
  .desc{font-family:system-ui, sans-serif;font-size:15px;line-height:1.45;margin:4px 0 18px;color:#2a2a2a}
  .label{font-family:Anton, Impact, sans-serif;font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .opt{
    min-width:46px;padding:9px 10px;
    font-family:"Rubik Mono One",sans-serif;font-size:12px;
    background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  }
  .opt.on{background:var(--ink);color:var(--yellow);box-shadow:none;transform:translate(3px,3px)}
  .qty{display:inline-flex;align-items:center;border:3px solid var(--ink);background:#fff;margin-bottom:22px}
  .qty button{width:44px;height:42px;font-family:"Rubik Mono One",sans-serif;font-size:16px}
  .qty span{min-width:40px;text-align:center;font-size:18px}
  .wa{
    display:block;text-align:center;text-decoration:none;color:var(--ink);
    font-family:Anton, Impact, sans-serif;font-size:19px;letter-spacing:.03em;text-transform:uppercase;
    background:var(--pink);border:3px solid var(--ink);
    padding:14px;box-shadow:6px 6px 0 var(--ink);
    transition:transform .12s, box-shadow .12s;
  }
  .wa:active{transform:translate(6px,6px);box-shadow:0 0 0 var(--ink)}
  .note{font-family:system-ui,sans-serif;font-size:12.5px;color:var(--grey);margin-top:14px;text-align:center}

  .svgtxt{font-family:"Archivo Black", Impact, sans-serif}

  @media (min-width:700px){
    :root{--card-w:340px}
    .arrow.prev{left:-72px}.arrow.next{right:-72px}
    .sheet{left:50%;right:auto;width:520px;margin-left:-260px;border:4px solid var(--ink);border-bottom:0}
  }
  @media (prefers-reduced-motion:reduce){
    .track,.sheet,.backdrop{transition:none}
  }
</style>
</head>
<body>

<header class="top">
  <div class="logo" aria-label="Diseridú">DISERIDÚ</div>
</header>

<nav class="cats" id="cats" aria-label="Categorías"></nav>
<nav class="subcats" id="lines" aria-label="Tipos de remera" hidden></nav>

<main>
  <section class="stage" aria-roledescription="carrusel" aria-label="Artículos">
    <button class="arrow prev" id="prev" aria-label="Anterior">&lsaquo;</button>
    <div class="viewport" id="viewport">
      <div class="track" id="track" aria-live="polite"></div>
    </div>
    <button class="arrow next" id="next" aria-label="Siguiente">&rsaquo;</button>
  </section>
  <div class="meta">
    <div class="counter" id="counter"></div>
    <div class="dots" id="dots" aria-hidden="true"></div>
  </div>
</main>

<footer>
  DISERIDÚ © <span id="year"></span> · <a id="footWa" href="#" target="_blank" rel="noopener">CONSULTAS POR WHATSAPP</a>
</footer>

<div id="sheetWrap">
  <div class="backdrop" id="backdrop"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalle del artículo">
    <div class="sheet-inner" id="sheetInner"></div>
  </aside>
</div>

    const natural = l.length * size * 0.74;
    const fit = natural > maxW ? ` textLength="${maxW}" lengthAdjust="spacingAndGlyphs"` : "";
    return `<text x="${cx + ox}" y="${(y0 + i * lh + oy).toFixed(1)}" fill="${fill}" font-size="${size}" text-anchor="middle"${fit}>${l}</text>`;
  }).join("");
  return `<g class="svgtxt" transform="rotate(${rot} ${cx} ${cy})">${ghost ? draw(ghost, 5, 3) : ""}${draw(ink, 0, 0)}</g>`;
}

const SHIRT = "M62 42 L86 33 Q100 46 114 33 L138 42 L166 68 L147 88 L137 79 L137 166 L63 166 L63 79 L53 88 L34 68 Z";

function tapaPrint(p){
  const a2 = p.accent2 || CREAM;
  const m = p.motif === "sun"
    ? `<circle cx="100" cy="106" r="14" fill="${a2}" stroke="${INK}" stroke-width="2"/><path d="M80 126 H120" stroke="${INK}" stroke-width="2.5"/>`
    : p.motif === "bars"
    ? [0,1,2].map(i => `<rect x="${83 + i*12}" y="96" width="8" height="26" fill="${a2}" stroke="${INK}" stroke-width="1.5"/>`).join("")
    : `<circle cx="100" cy="111" r="18" fill="${INK}"/><circle cx="100" cy="111" r="6" fill="${CREAM}"/>`;
  return `<rect x="73" y="84" width="54" height="54" fill="${p.accent}" stroke="${INK}" stroke-width="2.5"/>${m}`;
}

const photoOf = (p, ci = 0) => p.colors ? p.colors[ci].img : p.img;

function art(p, ci = 0){
  const src = photoOf(p, ci);
  if (src) return `<img src="${src}" alt="${p.name}${p.colors ? " — " + p.colors[ci].name : ""}" loading="lazy" draggable="false">`;
  const ink = p.ink || INK;
  let s = "";
  switch (p.kind){
    case "remera": {
      const g = p.garment || CREAM;
      s = `<path d="${SHIRT}" transform="translate(7 7)" fill="${SHADOW}"/>
           <path d="${SHIRT}" fill="${g}" stroke="${INK}" stroke-width="3" stroke-linejoin="round"/>
           <path d="M86 33 Q100 50 114 33" fill="none" stroke="${g === INK ? "#3a3a3a" : INK}" stroke-width="3"/>
           ${p.print === "tapa"
              ? tapaPrint(p)
              : textBlock(p.text, 100, 112, 112, 21, ink, p.ghost)}`;
      break;
    }
    case "tapa": {
      const cover = p.motif === "bars"
        ? [0,1,2].map(i => `<rect x="${44 + i*26}" y="60" width="16" height="44" fill="${p.accent}" stroke="${INK}" stroke-width="2"/>`).join("")
        : `<circle cx="82" cy="82" r="24" fill="${p.accent}" stroke="${INK}" stroke-width="3"/>`;
      s = `<circle cx="146" cy="104" r="54" fill="${SHADOW}"/>
           <circle cx="140" cy="100" r="54" fill="${INK}"/>
           <circle cx="140" cy="100" r="42" fill="none" stroke="#3a3a3a" stroke-width="2"/>
           <circle cx="140" cy="100" r="30" fill="none" stroke="#3a3a3a" stroke-width="2"/>
           <circle cx="140" cy="100" r="15" fill="${p.accent}"/>
           <circle cx="140" cy="100" r="3" fill="${INK}"/>
           <rect x="28" y="46" width="108" height="108" transform="translate(7 7)" fill="${SHADOW}"/>
           <rect x="28" y="46" width="108" height="108" fill="${p.sleeve || CREAM}" stroke="${INK}" stroke-width="3"/>
           ${cover}
           ${textBlock(p.text, 82, 130, 86, 18, INK, p.ghost, 0)}`;
      break;
    }
    case "grafica": {
      const motif = p.motif === "waves"
        ? [58,72,86].map(y => `<path d="M64 ${y} q9 -9 18 0 t18 0 t18 0 t18 0" fill="none" stroke="${p.accent}" stroke-width="5" stroke-linecap="round"/>`).join("")
        : `<circle cx="100" cy="74" r="28" fill="${p.accent}" stroke="${INK}" stroke-width="3"/>`;
      s = `<rect x="54" y="26" width="92" height="134" transform="translate(7 7)" fill="${SHADOW}"/>
           <rect x="54" y="26" width="92" height="134" fill="${CREAM}" stroke="${INK}" stroke-width="3"/>
           ${motif}
           <path d="M64 110 H136" stroke="${INK}" stroke-width="3"/>
           ${textBlock(p.text, 100, 134, 74, 15, INK, p.ghost, 0)}`;
      break;
    }
    case "sticker":
      s = `<circle cx="106" cy="106" r="64" fill="${SHADOW}"/>
           <circle cx="100" cy="100" r="64" fill="#fff" stroke="${INK}" stroke-width="3"/>
           <circle cx="100" cy="100" r="54" fill="${p.accent}"/>
           ${textBlock(p.text, 100, 100, 86, 24, ink, p.ghost, -8)}`;
      break;
    case "tote":
      s = `<path d="M80 72 V58 Q80 38 100 38 Q120 38 120 58 V72" fill="none" stroke="${INK}" stroke-width="5"/>
           <rect x="58" y="70" width="84" height="98" transform="translate(7 7)" fill="${SHADOW}"/>
           <rect x="58" y="70" width="84" height="98" fill="#efe6cc" stroke="${INK}" stroke-width="3"/>
           ${textBlock(p.text, 100, 120, 72, 19, INK, p.ghost)}`;
      break;
    case "pin":
      s = `<circle cx="106" cy="106" r="52" fill="${SHADOW}"/>
           <circle cx="100" cy="100" r="52" fill="${CREAM}" stroke="${INK}" stroke-width="4"/>
           <path d="M60 100 Q100 62 140 100 Q100 138 60 100 Z" fill="#fff" stroke="${INK}" stroke-width="3"/>
           <circle cx="100" cy="100" r="16" fill="${p.accent}" stroke="${INK}" stroke-width="3"/>
           <circle cx="100" cy="100" r="6" fill="${INK}"/>
           <circle cx="95" cy="95" r="2.5" fill="#fff"/>`;
      break;
  }
  return `<svg viewBox="0 0 200 200" role="img" aria-label="${p.name}">${s}</svg>`;
}

/* =========================================================
   LÓGICA
   ========================================================= */
const $ = id => document.getElementById(id);
const nav = $("cats"), track = $("track"), vp = $("viewport");
const prevBtn = $("prev"), nextBtn = $("next");
const linesNav = $("lines");
let line = LINES[0].id, cat = "todos", list = [], idx = 0;

const catLabel = id => (CATS.find(c => c.id === id) || {}).label || "";
const priceText = p => p.price == null ? "Consultar disponibilidad" : "$" + p.price.toLocaleString("es-AR");
const pad = n => String(n).padStart(2, "0");

const inView = (lineId, catId) => PRODUCTS.filter(p =>
  (catId === "todos" || p.cat === catId) && (catId !== "remeras" || p.line === lineId));

function renderLines(){
  linesNav.hidden = cat !== "remeras";
  linesNav.innerHTML = LINES.map(l =>
    `<button class="chip${l.id === line ? " on" : ""}" data-line="${l.id}" aria-pressed="${l.id === line}">${l.label} <small>[${inView(l.id, "remeras").length}]</small></button>`
  ).join("");
}

function renderCats(){
  nav.innerHTML = CATS.map(c =>
    `<button class="chip${c.id === cat ? " on" : ""}" data-cat="${c.id}" aria-pressed="${c.id === cat}">${c.label}</button>`
  ).join("");
}

function cardHTML(p){
  return `<div class="slide"><article class="card">
    <div class="card-art${photoOf(p) ? " photo" : ""}" data-open="${p.id}" style="--bg:${p.bg};--bg2:${p.bg2}">
      <span class="tag">${catLabel(p.cat).toUpperCase()}</span>${art(p)}
    </div>
    <div class="card-body">
      <h2>${p.name}</h2>
      <p class="price${p.price == null ? "" : " has"}">${priceText(p)}</p>
      <button class="btn-ver" data-open="${p.id}">VER ARTÍCULO &rarr;</button>
    </div>
  </article></div>`;
}

function renderTrack(){
  list = inView(line, cat);
  idx = 0;
  const empty = cat === "remeras" && line === "personalizados"
    ? `<div class="empty">Tu remera, a medida<a class="btn-ver" href="${waLink("¡Hola! Quiero pedir una remera con diseño personalizado.")}" target="_blank" rel="noopener">PEDILO POR WHATSAPP &rarr;</a></div>`
    : `<div class="empty">Pronto hay novedades acá</div>`;
  track.innerHTML = list.length ? list.map(cardHTML).join("") : `<div class="slide">${empty}</div>`;
  update(false);
}

function update(animate = true){
  if (!animate) track.style.transition = "none";
  track.style.transform = `translateX(${-idx * 100}%)`;
  if (!animate){ void track.offsetWidth; track.style.transition = ""; }
  const n = list.length;
  $("counter").textContent = `${pad(n ? idx + 1 : 0)} / ${pad(n)}`;
  $("dots").innerHTML = list.map((_, i) => `<i class="${i === idx ? "on" : ""}"></i>`).join("");
  prevBtn.hidden = nextBtn.hidden = n < 2;
}

function go(i){
  const n = list.length;
  if (!n) return;
  idx = (i + n) % n;   // vuelve al principio al llegar al final
  update();
}

nav.addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b || b.dataset.cat === cat) return;
  cat = b.dataset.cat;
  renderLines(); renderCats(); renderTrack();
  nav.querySelector(".chip.on").scrollIntoView({ inline:"center", block:"nearest", behavior:"smooth" });
});
linesNav.addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b || b.dataset.line === line) return;
  line = b.dataset.line;
  renderLines(); renderTrack();
  linesNav.querySelector(".chip.on").scrollIntoView({ inline:"center", block:"nearest", behavior:"smooth" });
});
prevBtn.addEventListener("click", () => go(idx - 1));
nextBtn.addEventListener("click", () => go(idx + 1));

/* Deslizar con el dedo */
let sx = 0, sy = 0, dx = 0, dragging = false, axis = null, suppressClick = false;
vp.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse" && e.button !== 0) return;
  sx = e.clientX; sy = e.clientY; dx = 0; dragging = true; axis = null;
});
vp.addEventListener("pointermove", e => {
  if (!dragging) return;
  const x = e.clientX - sx, y = e.clientY - sy;
  if (axis === null && (Math.abs(x) > 8 || Math.abs(y) > 8)){
    axis = Math.abs(x) > Math.abs(y) ? "x" : "y";
    if (axis === "x"){ vp.setPointerCapture(e.pointerId); track.style.transition = "none"; }
  }
  if (axis !== "x") return;
  dx = x;
  track.style.transform = `translateX(calc(${-idx * 100}% + ${dx}px))`;
});
function endDrag(){
  if (!dragging) return;
  dragging = false;
  if (axis !== "x") return;
  track.style.transition = "";
  suppressClick = Math.abs(dx) > 8;
  setTimeout(() => suppressClick = false, 60);
  if (Math.abs(dx) > vp.offsetWidth * 0.18) go(idx + (dx < 0 ? 1 : -1));
  else update();
}
vp.addEventListener("pointerup", endDrag);
vp.addEventListener("pointercancel", endDrag);

track.addEventListener("click", e => {
  if (suppressClick) return;
  const el = e.target.closest("[data-open]");
  if (el) openSheet(el.dataset.open);
});

/* Hoja de detalle */
const wrap = $("sheetWrap"), inner = $("sheetInner");
let state = null;

function waLink(text){ return `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(text)}`; }
function waText(){
  const { p, size, qty, color } = state;
  return `¡Hola! Quiero consultar por: ${p.name}` + (p.colors ? ` — ${p.colors[color].name}` : "") + (size ? ` — ${p.kind === "grafica" ? "Tamaño" : "Talle"} ${size}` : "") + ` (x${qty})`;
}

function renderSheet(){
  const { p, size, qty, color } = state;
  inner.innerHTML = `
    <div class="card-art${photoOf(p) ? " photo" : ""}" style="--bg:${p.bg};--bg2:${p.bg2}">
      <span class="tag">${catLabel(p.cat).toUpperCase()}</span>
      <button class="close" data-close aria-label="Cerrar">✕</button>
      ${art(p, color)}
    </div>
    <div class="sheet-body">
      <h2>${p.name}</h2>
      <p class="price${p.price == null ? "" : " has"}">${priceText(p)}</p>
      <p class="desc">${p.desc || ""}</p>
      ${p.colors ? `<p class="label">Color</p>
        <div class="opts">${p.colors.map((c, i) => `<button class="opt${i === color ? " on" : ""}" data-color="${i}">${c.name}</button>`).join("")}</div>` : ""}
      ${p.sizes ? `<p class="label">${p.kind === "grafica" ? "Tamaño" : "Talle"}</p>
        <div class="opts">${p.sizes.map(s => `<button class="opt${s === size ? " on" : ""}" data-size="${s}">${s}</button>`).join("")}</div>` : ""}
      <p class="label">Cantidad</p>
      <div class="qty">
        <button data-q="-1" aria-label="Menos">−</button><span>${qty}</span><button data-q="1" aria-label="Más">+</button>
      </div>
      <a class="wa" href="${waLink(waText())}" target="_blank" rel="noopener">Consultar por WhatsApp &rarr;</a>
      <p class="note">Te respondemos con stock, forma de pago y envío.</p>
    </div>`;
}

function openSheet(id){
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;
  state = { p, size: p.sizes ? p.sizes[Math.min(1, p.sizes.length - 1)] : null, qty: 1, color: 0 };
  renderSheet();
  $("sheet").scrollTop = 0;
  wrap.classList.add("open");
  document.body.classList.add("lock");
  history.pushState({ sheet: true }, "");   // el botón "atrás" de Android cierra la hoja
}
function closeSheet(fromHistory){
  if (!wrap.classList.contains("open")) return;
  wrap.classList.remove("open");
  document.body.classList.remove("lock");
  if (!fromHistory) history.back();
}

inner.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeSheet();
  const c = e.target.closest("[data-color]");
  if (c){ state.color = Number(c.dataset.color); renderSheet(); return; }
  const s = e.target.closest("[data-size]");
  if (s){ state.size = s.dataset.size; renderSheet(); return; }
  const q = e.target.closest("[data-q]");
  if (q){ state.qty = Math.max(1, Math.min(20, state.qty + Number(q.dataset.q))); renderSheet(); }
});
$("backdrop").addEventListener("click", () => closeSheet());
window.addEventListener("popstate", () => closeSheet(true));
document.addEventListener("keydown", e => {
  if (wrap.classList.contains("open")){ if (e.key === "Escape") closeSheet(); return; }
  if (e.key === "ArrowLeft") go(idx - 1);
  if (e.key === "ArrowRight") go(idx + 1);
});

/* Inicio */
$("year").textContent = new Date().getFullYear();
$("footWa").href = waLink("¡Hola! Quería hacer una consulta.");
renderLines();
renderCats();
renderTrack();
</script>
</body>
